 (Wide-Legged Seated Forward Fold)."], ["Vairagya", "non-attachment or dispassion: letting go of craving. The partner of abhyasa."], ["Samskara", "an impression left in the mind by actions and experiences; repeated, they become habits and patterns."], ["Annamaya", "the outermost kosha: the physical body, “made of food”."], ["Manomaya", "the third kosha: the mental and emotional body."], ["Prakriti", "nature or matter: everything that changes, including body and mind. Made of the three gunas."], ["Santosha", "contentment with what you have. A niyama."], ["Ashtanga", "“eight limbs”: Patanjali's eight-limbed path from the Yoga Sutras."], ["Sushumna", "the central nadi running up the spine, through which kundalini rises."], ["Manipura", "the solar plexus chakra at the navel: willpower and confidence. Means “city of jewels”."], ["Nirodhah", "stilling, restraint, cessation."], ["Bhramari", "humming bee breath: a long hum on the exhale. Calming."], ["Nasagrai", "drishti at the tip of the nose."], ["Savasana", "corpse pose: the final rest at the end of class, to absorb the practice."], ["Paschima", "west / back body. As in Paschimottanasana (Seated Forward Fold)."], ["Bhujanga", "serpent / cobra. As in Bhujangasana (Cobra Pose)."], ["Sankalpa", "intention / resolve."], ["Abhyasa", "practice: steady effort, done for a long time, without breaks and with dedication. The partner of vairagya."], ["Samyama", "“holding together”: dharana, dhyana and samadhi practised together on one object. Taught in Book 3 of the Yoga Sutras."], ["Vedanta", "“end of the Vedas”: another name for the Upanishads and the philosophy based on them."], ["Brahman", "ultimate reality, the universal consciousness behind everything."], ["Purusha", "pure consciousness: the unchanging true Self, the seer or witness."], ["Samkhya", "the philosophy behind the Yoga Sutras, which divides reality into Purusha and Prakriti."], ["Niyamas", "the second limb: five personal observances (saucha, santosha, tapas, svadhyaya, Ishvara pranidhana)."], ["Dharana", "concentration, fixing the mind on one point; the sixth limb."], ["Samadhi", "absorption or bliss, where only the object of meditation remains; the eighth limb."], ["Pingala", "the nadi on the right: solar, heating, energising. Ends at the right nostril."], ["Anahata", "the heart chakra: love and compassion. Means “unstruck”."], ["Sitkari", "hissing breath: inhaling across the teeth. Cooling; used if you can't curl the tongue."], ["Drishti", "focused gaze: a point where the eyes rest in a pose, to steady the mind."], ["Vinyasa", "placing in a special way: linking breath with movement, flowing from pose to pose."], ["Iyengar", "B.K.S. Iyengar, Krishnamacharya's student, known for precise alignment, props and the book Light on Yoga."], ["Consent", "a student's agreement to a hands-on assist; it can be withdrawn at any time."], ["Utthita", "extended. As in Utthita Trikonasana (Extended Triangle Pose)."], ["Chandra", "moon. As in Ardha Chandrasana (Half Moon)."], ["Namaste", "“I bow to you”."], ["Salamba", "supported. As in Salamba Bhujangasana (Sphinx Pose)."], ["Trikona", "triangle. As in Parivrtta Trikonasana (Revolved Triangle)."], ["Samana", "the vayu that moves towards the centre, at the navel; governs digestion and assimilation."], ["Viveka", "discernment: telling the real and lasting (the Self) from the unreal and changing."], ["Dukkha", "suffering or dissatisfaction; literally a badly fitting wheel. The opposite of sukha."], ["Sukham", "ease, comfort (the form of sukha used in sutra 2.46)."], ["Sattva", "the guna of balance, clarity, harmony and light. Yoga aims to increase it."], ["Bandha", "a lock or seal used in asana and pranayama to hold and direct prana, e.g. mula bandha."], ["Klesha", "an affliction, a cause of suffering. Patanjali lists five."], ["Avidya", "ignorance: mistaking the changing for the lasting, and body and mind for the Self. The root of the other kleshas."], ["Asmita", "ego or “I-am-ness”: identifying with body and mind."], ["Dvesha", "aversion: pushing away what gives pain."], ["Niyama", "the second limb: personal observances, how we treat ourselves."], ["Ahimsa", "non-violence in thought, word and action, including towards yourself. A yama."], ["Asteya", "non-stealing, including time and energy. A yama."], ["Saucha", "cleanliness and purity of body and mind. A niyama."], ["Asanam", "posture, seat (the form of asana used in sutra 2.46)."], ["Dhyana", "meditation, an unbroken flow of attention; the seventh limb."], ["Chakra", "“wheel”: an energy centre along the spine. There are seven, from root to crown."], ["Vritti", "a fluctuation or whirl of the mind: thoughts, memories, imaginings."], ["Sthira", "steady, stable, alert. One of the two qualities of asana in sutra 2.46."], ["Ujjayi", "victorious breath, also called ocean breath: breathing through the nose with the back of the throat gently narrowed, making a soft sound. The main breath of Vinyasa."], ["Sitali", "cooling breath: inhaling through a curled tongue."], ["Dirgha", "three-part breath: fill the belly, ribs, then chest, and empty in reverse. Calming."], ["Baddha", "bound. As in Baddha Konasana (Bound Angle)."], ["Parsva", "side. As in Parsva Bakasana (Side Crow)."], ["Ubhaya", "both. As in Ubhaya Padangusthasana (Both Big Toes Pose)."], ["Utkata", "fierce. As in Utkatasana (Chair Pose)."], ["Urdhva", "upward. As in Urdhva Dhanurasana (Upward Bow)."], ["Chatur", "four. As in Chaturanga Dandasana (Four-Limbed Staff Pose)."], ["Garuda", "eagle. As in Garudasana (Eagle Pose)."], ["Mantra", "sacred sound or phrase."], ["Matsya", "fish. As in Matsyasana (Fish Pose)."], ["Sangha", "community / spiritual fellowship."], ["Shanti", "peace."], ["Ushtra", "camel. As in Ustrasana (Camel)."], ["Uttana", "intense stretch. As in Ardha Uttanasana (Halfway Lift)."], ["Prana", "the life force or vital energy. Also the name of the first vayu: inward-moving, in the chest and head, governing breathing in."], ["Apana", "the downward-moving vayu, centred in the pelvis; governs elimination and letting go."], ["Udana", "the upward-moving vayu, at the throat; governs speech, expression and growth."], ["Vyana", "the vayu that pervades the whole body and moves outward; governs circulation and coordination."], ["Sukha", "ease, comfort or happiness. The opposite of dukkha, and one of the two qualities of asana in sutra 2.46."], ["Rajas", "the guna of activity, energy, passion and restlessness."], ["Tamas", "the guna of inertia, heaviness and dullness; also gives rest and stability."], ["Vedas", "the oldest sacred texts of India; the Upanishads are their final part."], ["Atman", "the individual Self, the true “I” beyond body and mind."], ["Kosha", "a sheath or layer around the Self; there are five, from physical to bliss."], ["Yamas", "the first limb: five ethical restraints for how we treat others (ahimsa, satya, asteya, brahmacharya, aparigraha)."], ["Satya", "truthfulness. A yama."], ["Tapas", "discipline or austerity; literally heat, inner fire. A niyama."], ["Asana", "posture or seat; the third limb. Sutra 2.46 says it should be steady and comfortable."], ["Citta", "the mind, the whole mind-field (thoughts, intellect and ego)."], ["Mudra", "a seal or gesture, often made with the hands."], ["Nabhi", "drishti at the navel, as in downward dog."], ["Hatha", "the branch of yoga that brought in postures, breath control, bandhas and mudras (about 1000 to 1500 CE)."], ["Ardha", "half. As in Ardha Chandrasana (Half Moon)."], ["Dhanu", "bow. As in Dhanurasana (Bow Pose)."], ["Hasta", "hand. As in Urdhva Hastasana (Upward Salute)."], ["Mukha", "face. As in Adho Mukha Svanasana (Downward-Facing Dog)."], ["Purva", "east / front body. As in Purvottanasana (Upward Plank)."], ["Sirsa", "head. As in Sirsasana (Headstand)."], ["Supta", "reclined. As in Supta Kapotasana (Sleeping Pigeon)."], ["Surya", "sun. As in Surya Namaskar (Sun Salutation)."], ["Vrksa", "tree. As in Vrksasana (Tree Pose)."], ["Danda", "staff. As in Dandasana (Staff Pose)."], ["Shava", "corpse. As in Savasana (Corpse Pose)."], ["Vayu", "wind or air. The five vayus are the five movements of prana in the body."], ["Guna", "one of the three qualities found in all of nature: sattva, rajas and tamas."], ["Raga", "attachment: clinging to what gives pleasure."], ["Yama", "the first limb: ethical restraints, how we treat others and the world."], ["Nadi", "an energy channel that carries prana; traditionally there are 72,000."], ["Ajna", "the third eye chakra, between the eyebrows: intuition and insight. Ida and pingala meet here."], ["Atha", "“now”: the first word of the Yoga Sutras, signalling readiness to begin."], ["2.46", "Sthira sukham asanam: “Posture should be steady and comfortable.” Patanjali's only instruction on asana."], ["Janu", "knee. As in Janu Sirsasana (Head-to-Knee Pose)."], ["Kona", "angle. As in Baddha Konasana (Bound Angle)."], ["Nava", "boat. As in Navasana (Boat)."], ["Pada", "foot. As in Prasarita Padottanasana (Wide-Legged Forward Fold)."], ["Pida", "pressure. As in Karnapidasana (Ear Pressure Pose)."], ["Setu", "bridge. As in Setu Bandha Sarvangasana (Bridge Pose)."], ["Svan", "dog. As in Urdhva Mukha Svanasana (Upward-Facing Dog)."], ["Vira", "warrior. As in Virabhadrasana (Warrior)."], ["Adho", "down / downward. As in Adho Mukha Vrksasana (Handstand)."], ["Bala", "child. As in Balasana (Child's Pose)."], ["Guru", "teacher / spiritual preceptor (lit. “heavy, weighty”)."], ["Hala", "plough. As in Halasana (Plough)."], ["Tada", "mountain. As in Tadasana (Mountain)."], ["Ida", "the nadi on the left: lunar, cooling, calming. Ends at the left nostril."], ["1.1", "Atha yoga-anushasanam: “Now begins the teaching of yoga.” The opening line of the Yoga Sutras."], ["1.2", "Yoga citta-vritti-nirodhah: “Yoga is the stilling of the fluctuations of the mind.” Patanjali's definition of yoga."], ["Eka", "one. As in Eka Pada Rajakapotasana (One-Legged King Pigeon)."], ["Tri", "three. As in Trikonasana (Triangle)."], ["Go", "cow. As in Gomukhasana (Cow Face)."], ["Ut", "intense. As in Uttanasana (Standing Forward Fold)."], ["OM", "primordial sound."]];
function defsFor(texts){
  let blob=" "+texts.filter(Boolean).join(" | ")+" ";const out=[];
  for(const [k,v] of DEFS){
    if(out.length>=8)break;
    const pat=k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
    const re=new RegExp("(^|[^A-Za-zĀ-ɏ])("+pat+")s?(?![A-Za-zĀ-ɏ])",k.length>=4?"gi":"g");
    if(re.test(blob)){out.push([k,v]);blob=blob.replace(re,"$1 ");}
  }
  return out;
}

const PODCAST=[{"id": "ep1", "title": "Exam 1: Patanjali's path", "summary": "Sutras 1.1, 1.2 and 2.46, the eight limbs, the yamas and niyamas, abhyasa and samyama.", "seconds": 351, "transcript": [["Maya", "Welcome to Yoga Theory Revision. I'm Maya."], ["Tom", "And I'm Tom. In this episode we're walking through Patanjali's path: three key sutras, the eight limbs, the yamas and niyamas, and two ideas called abhyasa and samyama."], ["Maya", "We'll stop now and then for a quick question, so have a go at answering before we give it away. Let's start at the very beginning of the Yoga Sutras."], ["Tom", "Sutra 1.1. Atha yoga anushasanam. It means: now begins the teaching of yoga."], ["Maya", "And that first word, atha, now, matters. It signals readiness. The student has arrived prepared, and the teaching can begin. Anushasanam is teaching or instruction, passed from teacher to student."], ["Tom", "Then straight away, sutra 1.2, Patanjali's definition of yoga. Yoga citta vritti nirodhah."], ["Maya", "Yoga is the stilling of the fluctuations of the mind. Three words to know. Citta is the mind, the whole mind field. Vritti are the fluctuations, the whirls of thought, memory and imagination. And nirodhah means stilling or restraint."], ["Tom", "So the whole system of yoga, in one line, is about calming those whirls in the mind."], ["Maya", "And the third sutra on your list is from Book 2. Sutra 2.46. Sthira sukham asanam."], ["Tom", "Posture should be steady and comfortable. Sthira means steady, stable, alert. Sukha means ease or comfort. And asana is posture, or literally seat."], ["Maya", "It's the only instruction Patanjali gives about asana. Every pose should hold both qualities at once: steadiness and ease."], ["Tom", "Quick question. Which sutra says yoga is the stilling of the fluctuations of the mind?"], ["Maya", "That's sutra 1.2. Yoga citta vritti nirodhah. And 1.1 is the opening line, now begins the teaching of yoga. 2.46 is steady and comfortable posture."], ["Tom", "Now, the eight limbs. Patanjali's eight limbed path is also called ashtanga, which simply means eight limbs."], ["Maya", "In order: yama, niyama, asana, pranayama, pratyahara, dharana, dhyana, samadhi."], ["Tom", "Let's give each one a meaning. Yama: ethical restraints, how we treat others. Niyama: personal observances, how we treat ourselves. Asana: posture. Pranayama: breath control."], ["Maya", "Pratyahara: withdrawal of the senses. It's the bridge between the outer limbs and the inner ones. Then dharana, concentration. Dhyana, meditation. And samadhi, absorption, or bliss."], ["Tom", "A way to remember it: the path moves from how we behave in the world, through the body and breath, and inward to the mind."], ["Maya", "Question. Which limb comes straight after asana?"], ["Tom", "Pranayama, breath control. And which limb comes just before samadhi?"], ["Maya", "Dhyana, meditation."], ["Tom", "Those last three limbs, dharana, dhyana and samadhi, lead us to samyama. Samyama means holding together. It's when concentration, meditation and absorption are practised together on one object. It's taught in Book 3 of the Yoga Sutras."], ["Maya", "So the order inside samyama is dharana, then dhyana, then samadhi. Each one deepens the one before."], ["Tom", "Back to the first limb. The five yamas. Ahimsa, satya, asteya, brahmacharya, aparigraha."], ["Maya", "Ahimsa is non violence, in thought, word and action, and that includes how we treat ourselves. Many teachers say it underlies all the others."], ["Tom", "Satya is truthfulness. Asteya is non stealing, and that can include other people's time and energy. Brahmacharya is moderation, the wise use of energy. And aparigraha is non greed or non possessiveness, not taking more than you need."], ["Maya", "And the second limb, the five niyamas. Saucha, santosha, tapas, svadhyaya and Ishvara pranidhana."], ["Tom", "Saucha is cleanliness, purity of body and mind. Santosha is contentment with what you have. Tapas is discipline. It literally means heat, an inner fire."], ["Maya", "Svadhyaya is self study, which includes studying yoga texts. And Ishvara pranidhana is surrender, or devotion, to a higher power."], ["Tom", "So what's the difference between the yamas and the niyamas?"], ["Maya", "The yamas are about how we treat others and the world. The niyamas are about how we treat ourselves."], ["Tom", "Quick fire round. Not taking more than you need?"], ["Maya", "Aparigraha."], ["Tom", "Contentment?"], ["Maya", "Santosha."], ["Tom", "Non violence?"], ["Maya", "Ahimsa."], ["Tom", "Self study?"], ["Maya", "Svadhyaya."], ["Tom", "Last idea for this episode: abhyasa. Abhyasa means practice. Steady, repeated effort."], ["Maya", "Patanjali says practice becomes firmly established when it's done for a long time, without breaks, and with dedication."], ["Tom", "And abhyasa always comes paired with vairagya, which means non attachment, or letting go. Practice and non attachment together still the mind."], ["Maya", "People often compare them to the two wings of a bird. Effort without letting go becomes strain. Letting go without effort becomes drift."], ["Tom", "Let's recap. Sutra 1.1, now begins the teaching of yoga. Sutra 1.2, yoga is the stilling of the fluctuations of the mind. Sutra 2.46, posture should be steady and comfortable."], ["Maya", "Eight limbs: yama, niyama, asana, pranayama, pratyahara, dharana, dhyana, samadhi. The last three together are samyama."], ["Tom", "Five yamas, five niyamas, and abhyasa, practice, paired with vairagya, non attachment."], ["Maya", "Next time: the mind and the self. Purusha and prakriti, the gunas, the kleshas, and more. See you then."]]}, {"id": "ep5", "title": "Exam 2: Vinyasa, drishti and accessibility", "summary": "What vinyasa means, the three internal tools, drishti points, and how to make a class accessible.", "seconds": 176, "transcript": [["Maya", "Welcome back to Yoga Theory Revision. I'm Maya."], ["Tom", "And I'm Tom. This episode covers three topics from the general knowledge section of your exam: vinyasa, drishti and accessibility."], ["Maya", "Let's start with the word vinyasa. Nyasa means to place, and vi means in a special way. So vinyasa is placing in a special way, with intention."], ["Tom", "In practice, it means linking breath with movement. Every movement is matched to an inhale or an exhale, like in a sun salutation."], ["Maya", "And you'll hear vinyasa used for the short linking flow between poses too. When a teacher says take a vinyasa, they usually mean chaturanga, upward dog, then downward dog."], ["Tom", "Vinyasa teachers talk about three internal tools. Can you name all three?"], ["Maya", "Breath, bandha and drishti. Breath is usually ujjayi. Bandha is an energy lock. And drishti is the gaze."], ["Tom", "Modern vinyasa flow comes from Krishnamacharya, who taught in Mysore, and his student Pattabhi Jois, who created Ashtanga Vinyasa. Western teachers then adapted it into the flowing classes we know today."], ["Maya", "So, drishti. It means focused gaze: a point where the eyes rest in a pose."], ["Tom", "Why use it? Three reasons. It steadies and focuses the mind. It helps with balance. And it turns attention inwards, which supports pratyahara, withdrawal of the senses."], ["Maya", "There are four drishti points to know. Nasagrai is the tip of the nose. Bhrumadhya is between the eyebrows, the third eye. Nabhi is the navel. And Hastagrai is the hand."], ["Tom", "Quick question. Where do you look in downward facing dog?"], ["Maya", "Nabhi, the navel. And in Warrior Two, you look past your front hand, so that's Hastagrai."], ["Tom", "One more thing about drishti. Offer it softly. The gaze should be relaxed, never strained, and a student with a sore neck can change it."], ["Maya", "Now accessibility. An accessible class is one where every student can take part, whatever their body, age, ability or experience."], ["Tom", "The most important habit: always offer an option alongside the full pose, every time."], ["Maya", "Use props. Blocks, straps, bolsters, blankets, a chair or the wall all bring the pose to the student."], ["Tom", "Use invitational language. You might, if it feels available. And leave out words like just, simply and easy, because a pose isn't easy for everyone."], ["Maya", "Cue sensation, not shape. Describe what a pose should feel like, rather than a fixed picture of how it should look."], ["Tom", "And ask about injuries and conditions at the start of class, before practice begins, so you can plan alternatives."], ["Maya", "Quick question. Give three ways to make a class more accessible."], ["Tom", "Offer options, use props, use inviting language, and ask about injuries. Any three of those will do."], ["Maya", "That's it for this episode. Next time, philosophy and history."]]}, {"id": "ep6", "title": "Exam 3: Philosophy and history", "summary": "Abhyasa and vairagya, the kleshas, purusha and prakriti, the story of yoga from the Upanishads to Vinyasa, and the key teachers.", "seconds": 208, "transcript": [["Maya", "Welcome back. I'm Maya."], ["Tom", "I'm Tom. Today it's the philosophy and history sections of your exam."], ["Maya", "Philosophy first, with a pair of words that always go together: abhyasa and vairagya."], ["Tom", "Abhyasa is practice: steady, consistent effort over a long time. Vairagya is non-attachment, letting go of the outcome."], ["Maya", "Patanjali says the mind is stilled by both together. Practice without letting go becomes striving. Letting go without practice becomes passive."], ["Tom", "A nice way to remember it: practice is the inhale, non-attachment is the exhale."], ["Maya", "And vairagya is not the same as not caring. It means taking part fully, without depending on how things turn out. On the mat, that's doing your best in a pose without needing it to look a certain way."], ["Tom", "Quick question. Vairagya is paired with which idea?"], ["Maya", "Abhyasa, practice."], ["Tom", "Next, the kleshas. These are the five afflictions, the causes of suffering. Avidya, ignorance. Asmita, ego. Raga, attachment to pleasure. Dvesha, aversion. And abhinivesha, fear of death, or clinging to life."], ["Maya", "Avidya is the root of the other four."], ["Tom", "And purusha and prakriti. Purusha is pure consciousness, the unchanging witness. Prakriti is nature or matter: everything that changes, including the body and the mind."], ["Maya", "Now history. Here's the story in five steps."], ["Tom", "One. The Upanishads, from about 800 BCE. Yoga moves from ritual to inner knowledge: the Self, atman, and the universal, brahman."], ["Maya", "Two. The Bhagavad Gita, a conversation between Arjuna and Krishna. It brings yoga into everyday life, through karma yoga, action, bhakti yoga, devotion, and jnana yoga, knowledge."], ["Tom", "Three. Classical yoga. Patanjali's Yoga Sutras, about 200 to 400 CE, set out the eight limbs. Here asana means a steady, comfortable seat for meditation, not a flowing sequence."], ["Maya", "Four. Hatha yoga, about 1000 to 1500 CE. This is when the body comes in: postures, breath control, bandhas and mudras, in texts like the Hatha Yoga Pradipika."], ["Tom", "And five. Modern yoga in the twentieth century. Hatha blends with gymnastics and exercise, and Krishnamacharya develops breath-linked sequences in Mysore. That leads to Ashtanga Vinyasa and then modern vinyasa flow."], ["Maya", "Quick question. Put these in order: hatha yoga, the Upanishads, the Yoga Sutras."], ["Tom", "The Upanishads, then the Yoga Sutras, then hatha yoga."], ["Maya", "Now the key teachers. Krishnamacharya, who lived from 1888 to 1989, is called the father of modern yoga."], ["Tom", "His students spread yoga around the world. Pattabhi Jois created Ashtanga Vinyasa. B K S Iyengar focused on precise alignment and props, and wrote Light on Yoga. Indra Devi took yoga to Hollywood. And his son, Desikachar, adapted practice to the individual."], ["Maya", "Before all of them, Swami Vivekananda brought yoga philosophy to the West, with a famous speech in Chicago in 1893."], ["Tom", "Quick question. Who is best known for introducing props?"], ["Maya", "B K S Iyengar. That's the end of this episode. Next, the breath."]]}, {"id": "ep7", "title": "Exam 4: Pranayama, breath and music", "summary": "Ujjayi, the other main breathing techniques, linking breath and movement, and using music in class.", "seconds": 181, "transcript": [["Maya", "Welcome back. I'm Maya."], ["Tom", "And I'm Tom. This episode is the pranayama and methodology section: ujjayi, other techniques, breath and movement, and music."], ["Maya", "Ujjayi means victorious breath. It's also called ocean breath, because of its soft sound."], ["Tom", "To do it, breathe in and out through the nose, with the mouth closed, and gently narrow the back of the throat. The breath is long, even and just audible."], ["Maya", "A good way to teach it: breathe out with the mouth open, as if you're fogging a mirror. Then close the mouth and keep that same feeling in the throat."], ["Tom", "Why use it in vinyasa? It paces the movement, it focuses the mind, and it builds gentle heat. It's also feedback. If the breath gets strained or ragged, that's a sign to ease off."], ["Maya", "Now the other techniques. Each has an English name, and that's what to learn."], ["Tom", "Nadi shodhana is alternate nostril breathing. Balancing and calming."], ["Maya", "Kapalabhati is skull-shining breath: short, sharp exhales from the belly. Energising. Avoid it in pregnancy and with high blood pressure or heart conditions."], ["Tom", "Bhastrika is bellows breath, forceful breathing in and out. Also energising, with the same cautions."], ["Maya", "Bhramari is humming bee breath, a long hum on the exhale. Very calming."], ["Tom", "Sitali is cooling breath, breathing in through a curled tongue. If you can't curl your tongue, sitkari draws the air in across the teeth instead."], ["Maya", "Dirgha is three-part breath. Fill the belly, then the ribs, then the chest, and empty in reverse."], ["Tom", "And sama vritti is equal breathing, where the inhale and exhale are the same length."], ["Maya", "Quick question. Which three of these are calming: kapalabhati, bhramari, nadi shodhana, dirgha?"], ["Tom", "Bhramari, nadi shodhana and dirgha. Kapalabhati is energising."], ["Maya", "Next, breath and movement. A simple rule. Inhale with movements that lift, open or lengthen, like raising the arms or a backbend."], ["Tom", "Exhale with movements that fold, twist or lower, like a forward fold or a twist."], ["Maya", "Let the breath lead. The movement starts with the breath and fits inside it: one breath, one movement."], ["Tom", "And in the Yogaposa course, cues follow an order: breath, instruction, pose name, cue. For example: inhale, step your right foot forward, Warrior One, root down through your back heel."], ["Maya", "Quick question. Is a forward fold done on an inhale or an exhale?"], ["Tom", "An exhale."], ["Maya", "Finally, music. It's optional, and it should support the class, not take it over."], ["Tom", "Keep it low enough that your cues are clearly heard, and match the tempo to the part of class: calmer at the start and the end."], ["Maya", "Many teachers use instrumental music or silence for savasana, because lyrics can distract. And in the UK, playing recorded music in a public class usually needs a music licence, unless the venue already has one."], ["Tom", "That's this episode. Last one: teaching and professional practice."]]}, {"id": "ep8", "title": "Exam 5: Teaching and professional practice", "summary": "Class structure, good cues, consent and adjustments, inclusion and professional boundaries.", "seconds": 191, "transcript": [["Maya", "Welcome back. I'm Maya."], ["Tom", "And I'm Tom. In this episode, the teaching and professional practice section: class structure, cues, consent, inclusion and boundaries."], ["Maya", "A well-shaped class has a clear arc. Arrive, build heat, reach a peak, cool down, and rest."], ["Tom", "At the start, welcome everyone, ask about injuries, check consent for hands-on assists, and settle the breath."], ["Maya", "The Yogaposa course uses a four beat structure. Can you remember the four beats?"], ["Tom", "Warm up, stand up, sit down, lie down. Warm up is sun salutations A and B. Stand up is standing poses. Sit down is seated poses. And lie down is closing poses and savasana."], ["Maya", "A peak pose is the most demanding pose of the class. The sequence prepares the body for it, then cools down afterwards."], ["Tom", "And savasana closes the practice, a few minutes of stillness to absorb what you've done."], ["Maya", "Now cues. There are three kinds. Verbal, what you say. Visual, demonstrating. And tactile, hands-on, only with consent."], ["Tom", "Good cues are clear and short. Cue the action before the pose name, so people can follow even if they don't know the pose."], ["Maya", "Invite rather than command. You might, when you're ready. Say what to do, rather than what not to do."], ["Tom", "And drop words like just and simply. Quick question. Which is the better cue: straighten your leg, or lengthen through your leg, keeping a soft bend if that feels better?"], ["Maya", "The second one. It's inviting, and it offers an option."], ["Tom", "Consent next. Never adjust without asking. Ask at the start of class, and check in again before you assist."], ["Maya", "Make it easy to say no. Some teachers use consent cards that students place by their mat. And a no needs no explanation."], ["Tom", "Consent can be withdrawn at any time. If someone said yes earlier but looks uneasy, check in again."], ["Maya", "Adjustments can be verbal, visual or hands-on. Hands-on assists should be gentle, purposeful, within your training, and never into pain."], ["Tom", "Being trauma-aware helps too: tell the student what you're about to do, and approach from where they can see you."], ["Maya", "Now inclusion. Make everyone feel welcome, whatever their body, age, ability, gender or background. Say welcome, everyone, rather than ladies or guys."], ["Tom", "And respect yoga's roots, teaching Sanskrit and philosophy with care."], ["Maya", "Professional boundaries. A yoga teacher doesn't diagnose or give medical advice. That's called working within your scope of practice. If a student has pain, offer modifications and suggest they see a doctor or physio."], ["Tom", "Keep relationships with students professional, and keep any health information they share confidential."], ["Maya", "Professional practice also means insurance, first aid training, and arriving prepared and on time."], ["Tom", "Quick question. A student tells you about a health condition. What do you do?"], ["Maya", "Keep it confidential, and use it only to keep them safe in class."], ["Tom", "That's the last exam episode. Try the mock test in the quiz, and good luck."], ["Maya", "Thanks for listening to Yoga Theory Revision."]]}, {"id": "ep2", "title": "Extra 1: The mind and the Self", "summary": "Purusha and prakriti, the gunas, the kleshas, viveka, samskara, dukkha, the Upanishads and the koshas.", "seconds": 315, "transcript": [["Maya", "Welcome back to Yoga Theory Revision. I'm Maya."], ["Tom", "I'm Tom. This episode is all about the mind and the Self: purusha and prakriti, the three gunas, the five kleshas, viveka, samskara, dukkha, the Upanishads and the koshas."], ["Maya", "Let's start with the big pair. Yoga philosophy draws on a system called Samkhya, which divides all of reality into two principles. Purusha and prakriti."], ["Tom", "Purusha is pure consciousness. The true Self. It never changes. It's often called the seer, or the witness."], ["Maya", "Prakriti is nature, or matter. Everything that changes and can be seen or known. That includes the body, the senses, and even the mind."], ["Tom", "That last part surprises people. Thoughts and feelings belong to prakriti, not purusha."], ["Maya", "So, question. Does the mind belong to purusha or prakriti?"], ["Tom", "Prakriti. Because the mind changes. Purusha is the unchanging awareness that watches it."], ["Maya", "And prakriti is made up of three qualities called the gunas. Sattva, rajas and tamas."], ["Tom", "Sattva is balance, clarity, harmony and light. Rajas is activity, energy, passion and restlessness. Tamas is inertia, heaviness and dullness."], ["Maya", "But tamas isn't all bad. It also gives us rest and stability. We need it to sleep. Problems come when the gunas are out of balance."], ["Tom", "Yoga practice aims to increase sattva."], ["Maya", "Try this. You feel restless and can't sit still. Which guna?"], ["Tom", "Rajas. And if you feel heavy, sluggish and unmotivated?"], ["Maya", "Tamas."], ["Tom", "Now, why do we suffer at all? Patanjali's answer is the five kleshas. Klesha means affliction, a cause of suffering."], ["Maya", "The five are avidya, asmita, raga, dvesha and abhinivesha."], ["Tom", "Avidya is ignorance. Mistaking what changes for what lasts, and mistaking body and mind for the true Self. It's the root of all the others."], ["Maya", "Asmita is ego, or I am ness, identifying with body and mind."], ["Tom", "Raga is attachment, clinging to what gives us pleasure. Dvesha is aversion, pushing away what gives us pain. They're opposite pulls."], ["Maya", "And abhinivesha is fear of death, clinging to life. Patanjali says it's found even in the wise."], ["Tom", "Question. Which klesha is the root of all the others?"], ["Maya", "Avidya, ignorance."], ["Tom", "And the cure for avidya is viveka. Viveka means discernment. The ability to tell the real from the unreal, the lasting from the passing."], ["Maya", "In yoga philosophy, viveka is seeing the difference between purusha, the true Self, and prakriti, the changing world of body and mind."], ["Tom", "Next, samskara. A samskara is an impression left in the mind by our actions, thoughts and experiences."], ["Maya", "Repeat the same samskara again and again, and it becomes a habit or pattern. Like a groove worn into a path."], ["Tom", "Reaching for your phone every time you feel bored, without even thinking: that's a samskara at work. And yoga practice helps us notice old samskaras and create new, healthier ones."], ["Maya", "Then dukkha. Dukkha means suffering, or dissatisfaction. The image behind the word is a wheel that doesn't fit its axle well, so the ride is bumpy."], ["Tom", "Its opposite is sukha: ease and happiness. The same sukha we met in sutra 2.46."], ["Maya", "And yoga teaches that much future suffering can be avoided."], ["Tom", "Let's move to the Upanishads. These are ancient philosophical texts from India."], ["Maya", "The name means sitting down near, like a student sitting close to a teacher. They're the final part of the Vedas, so they're also called Vedanta, the end of the Vedas."], ["Tom", "Their main teaching is that the individual Self, Atman, is one with ultimate reality, Brahman."], ["Maya", "And one of them, the Taittiriya Upanishad, gives us the five koshas."], ["Tom", "Kosha means sheath, or layer. We have five, from the outside in."], ["Maya", "Annamaya, the physical body, literally made of food. Pranamaya, the energy or breath body. Manomaya, the mental and emotional body."], ["Tom", "Vijnanamaya, the wisdom or intellect body. And anandamaya, the bliss body, the innermost layer."], ["Maya", "Question. Breathwork works most directly on which kosha?"], ["Tom", "Pranamaya, the energy and breath body. And which is the innermost?"], ["Maya", "Anandamaya, the bliss body."], ["Tom", "Recap time. Purusha is unchanging consciousness, the seer. Prakriti is nature, everything that changes, made of the three gunas: sattva, rajas and tamas."], ["Maya", "Five kleshas: avidya, asmita, raga, dvesha and abhinivesha, with avidya at the root. Viveka, discernment, is the cure."], ["Tom", "Samskaras are impressions that become habits. Dukkha is suffering, sukha is ease."], ["Maya", "The Upanishads teach that Atman is Brahman, and the koshas are five layers: annamaya, pranamaya, manomaya, vijnanamaya and anandamaya."], ["Tom", "Next episode: the subtle body. Prana, the bandhas, the nadis and the chakras. See you there."]]}, {"id": "ep3", "title": "Extra 2: The subtle body", "summary": "The five vayus, the bandhas, the nadis and the seven chakras.", "seconds": 245, "transcript": [["Maya", "Welcome to Yoga Theory Revision. I'm Maya."], ["Tom", "And I'm Tom. Today it's the subtle body: the five types of prana, the bandhas, the nadis and the seven chakras."], ["Maya", "Let's start with prana, the life force. In the body it moves as five vayus. Vayu means wind."], ["Tom", "Each vayu has its own area of the body, its own direction, and its own job."], ["Maya", "Prana vayu sits in the chest and head and moves inward. It governs breathing in, taking in."], ["Tom", "Apana is in the pelvis and moves downward. It governs elimination and letting go."], ["Maya", "Samana is at the navel and moves towards the centre. It governs digestion."], ["Tom", "Udana is at the throat and moves upward. It governs speech and expression."], ["Maya", "And vyana moves through the whole body, outward. It governs circulation."], ["Tom", "Question. Which vayu moves downward and governs elimination?"], ["Maya", "Apana. And which governs digestion?"], ["Tom", "Samana, at the navel. The five again: prana, apana, samana, udana, vyana."], ["Maya", "Now the bandhas. Bandha means lock, or seal. They're used in asana and pranayama to hold and direct prana."], ["Tom", "Mula bandha is the root lock, lifting the pelvic floor."], ["Maya", "Uddiyana bandha is the abdominal lock, drawing the belly in and up under the ribs. The name means flying up."], ["Tom", "Jalandhara bandha is the throat lock, drawing the chin towards the chest."], ["Maya", "And all three held together is maha bandha, the great lock."], ["Tom", "So: root, belly, throat. Mula, uddiyana, jalandhara."], ["Maya", "Next, the nadis. A nadi is an energy channel that carries prana around the body. Traditionally there are seventy two thousand of them."], ["Tom", "Three are the most important. Ida, on the left side: linked with the moon, cooling and calming."], ["Maya", "Pingala, on the right side: linked with the sun, heating and energising."], ["Tom", "And sushumna, the central channel running up the spine."], ["Maya", "Alternate nostril breathing, nadi shodhana, is designed to balance ida and pingala."], ["Tom", "Question. Which nadi runs up the centre of the spine?"], ["Maya", "Sushumna. Ida is left and lunar, pingala is right and solar."], ["Tom", "And along that central channel sit the chakras. Chakra means wheel. They're energy centres along the spine, and there are seven, from the base up."], ["Maya", "One. Muladhara, the root chakra, at the base of the spine. Grounding and safety."], ["Tom", "Two. Svadhisthana, the sacral chakra, in the lower belly. Creativity and emotions."], ["Maya", "Three. Manipura, the solar plexus chakra, at the navel. Willpower and confidence. The name means city of jewels."], ["Tom", "Four. Anahata, the heart chakra. Love and compassion. The name means unstruck, like a sound made without anything striking."], ["Maya", "Five. Vishuddha, the throat chakra. Communication and expression."], ["Tom", "Six. Ajna, the third eye, between the eyebrows. Intuition and insight. It's where ida and pingala are said to meet."], ["Maya", "And seven. Sahasrara, the crown chakra, at the top of the head. The thousand petal lotus. Connection to pure consciousness."], ["Tom", "Let's test it. Which chakra is at the heart?"], ["Maya", "Anahata. Which chakra is the third eye?"], ["Tom", "Ajna. And which is known as the thousand petal lotus?"], ["Maya", "Sahasrara, at the crown."], ["Tom", "One more. Willpower and confidence, at the solar plexus?"], ["Maya", "Manipura."], ["Tom", "Recap. Five vayus: prana, apana, samana, udana and vyana."], ["Maya", "Three main bandhas: mula, uddiyana and jalandhara. All three together is maha bandha."], ["Tom", "Three main nadis: ida, pingala and sushumna."], ["Maya", "And seven chakras from the base up: muladhara, svadhisthana, manipura, anahata, vishuddha, ajna and sahasrara."], ["Tom", "Next time, Sanskrit words you'll find in pose names and hear in class. See you then."]]}, {"id": "ep4", "title": "Extra 3: Sanskrit words", "summary": "All 62 words from the Yogaposa Sanskrit glossary, with example poses.", "seconds": 385, "transcript": [["Maya", "Welcome to the last episode of Yoga Theory Revision. I'm Maya."], ["Tom", "And I'm Tom. This one is all Sanskrit: the words from the Yogaposa glossary. First the core words, the building blocks of pose names, then the practice terms you'll hear in class."], ["Maya", "Here's how it works. I'll say a word. Try to say what it means before Tom does."], ["Tom", "And where it helps, I'll give you a pose that uses it. Let's go."], ["Maya", "Ardha."], ["Tom", "Half. As in Ardha Navasana, Low Boat."], ["Tom", "Baddha."], ["Maya", "Bound. As in Baddha Konasana, Bound Angle."], ["Maya", "Bandha."], ["Tom", "Lock. As in Setu Bandha Sarvangasana, Bridge Pose."], ["Tom", "Dhanu."], ["Maya", "Bow."], ["Maya", "Eka."], ["Tom", "One. As in Eka Pada Bakasana, One-Legged Crow."], ["Tom", "Go."], ["Maya", "Cow."], ["Maya", "Hasta."], ["Tom", "Hand. As in Mukta Hasta Sirsasana, Free-Hand Headstand."], ["Tom", "Janu."], ["Maya", "Knee. As in Janu Sirsasana, Head-to-Knee Pose."], ["Maya", "Kona."], ["Tom", "Angle."], ["Tom", "Mukha."], ["Maya", "Face. As in Adho Mukha Svanasana, Downward-Facing Dog."], ["Maya", "Nava."], ["Tom", "Boat."], ["Tom", "Pada."], ["Maya", "Foot. As in Eka Pada Bakasana, One-Legged Crow."], ["Maya", "Padangustha."], ["Tom", "Big toe."], ["Tom", "Parivrtta."], ["Maya", "Revolved. As in Parivrtta Utkatasana, Revolved Chair."], ["Maya", "Parsva."], ["Tom", "Side. As in Parsva Bakasana, Side Crow."], ["Tom", "Paschima."], ["Maya", "West or back body."], ["Maya", "Pida."], ["Tom", "Pressure."], ["Tom", "Prasarita."], ["Maya", "Spread. As in Pr  {name:"General yoga knowledge",ids:["sutras","limbs","yamas","niyamas","vinyasa","drishti","accessibility"]},

/* ---------- Quiz engine ---------- */
function start(title,items,topicId){
  S={title,items,i:0,score:0,results:[],topicId};
  render();
}
function render(){
  const {q,t}=S.items[S.i];
  const n=S.items.length;
  app.innerHTML=`
  <div class="stack">
    <div class="row" style="justify-content:space-between"><button class="link" id="quit">← Leave test</button><span class="eyebrow">${esc(S.title)}</span></div>
    <div class="progress"><i style="width:${(S.i/n)*100}%"></i></div>
    <div class="card">
      <div class="qmeta"><span>Question ${S.i+1} of ${n} · ${typeLabel[q.t]}</span><span>${esc(t.name)} · Score ${S.score}</span></div>
      <div class="q">${esc(q.q)}</div>
      ${q.c?`<div class="ctx">${esc(q.c)}</div>`:""}
      <div id="body"></div>
      <div id="fb"></div>
    </div>
  </div>`;
  $("#quit").onclick=()=>S.topicId?topicPage(S.topicId):home();
  ({mc:renderMC,match:renderMatch,order:renderOrder,recall:renderRecall,pick:renderPick,sa:renderSA})[q.t](q);
  window.scrollTo(0,0);
}
function finish(ok,html){
  S.results.push({item:S.items[S.i],ok});
  if(ok)S.score++;
  const fb=$("#fb");
  fb.innerHTML=`<div class="fb ${ok===null?"neutral":ok?"good":"bad"}">${html||""}</div>
  <div class="row" style="margin-top:12px"><button class="btn primary" id="next">${S.i+1<S.items.length?"Next question":"See results"}</button></div>`;
  $("#next").onclick=()=>{S.i++;S.i<S.items.length?render():results()};
  $("#next").focus({preventScroll:true});
}
const expl=(q,texts=[])=>{const d=defsFor([q.q,...texts]);return (q.x?`<span>${esc(q.x)}</span>`:"")+(d.length?`<div class="defs">${d.map(([k,v])=>`<span><b>${esc(k)}</b>: ${esc(v)}</span>`).join("")}</div>`:"")};

function renderMC(q){
  const correct=q.o[0];
  const opts=shuffle(q.o);
  $("#body").innerHTML=`<div class="opts">${opts.map((o,k)=>`<button class="opt" data-k="${k}">${esc(o)}</button>`).join("")}</div>`;
  const btns=[...document.querySelectorAll(".opt")];
  btns.forEach(b=>b.onclick=()=>{
    const pick=opts[+b.dataset.k];const ok=pick===correct;
    btns.forEach(x=>{x.disabled=true;if(opts[+x.dataset.k]===correct)x.classList.add("correct")});
    if(!ok)b.classList.add("wrong");
    finish(ok,`<strong>${ok?"Correct.":"Not quite. The answer is: "+esc(correct)}</strong>${expl(q,[correct,pick])}`);
  });
}

function renderMatch(q){
  const rights=shuffle([...new Set(q.p.map(p=>p[1]))]);
  const rows=shuffle(q.p);
  $("#body").innerHTML=`<div class="match">${rows.map((p,k)=>`
    <div class="mrow" data-k="${k}"><span class="l">${esc(p[0])}</span>
    <select id="m-${S.i}-${k}" aria-label="Match for ${esc(p[0])}"><option value="">Choose…</option>${rights.map(r=>`<option value="${esc(r)}">${esc(r)}</option>`).join("")}</select></div>`).join("")}
  </div><div class="row" style="margin-top:14px"><button class="btn primary" id="check">Check answers</button><span id="warn" class="eyebrow" hidden>Fill every row first</span></div>`;
  $("#check").onclick=()=>{
    const sels=[...document.querySelectorAll(".mrow select")];
    if(sels.some(s=>!s.value)){$("#warn").hidden=false;return}
    let right=0;
    rows.forEach((p,k)=>{
      const row=document.querySelector(`.mrow[data-k="${k}"]`);const s=sels[k];s.disabled=true;
      if(s.value===p[1]){right++;row.classList.add("correct")}
      else{row.classList.add("wrong");row.insertAdjacentHTML("beforeend",`<span class="fix">Answer: ${esc(p[1])}</span>`)}
    });
    $("#check").parentElement.remove();
    const ok=right===rows.length;
    finish(ok,`<strong>${ok?"All matched.":`${right} of ${rows.length} matched.`}</strong>${ok?"":"<span>Corrections are shown under each row.</span>"}${expl(q,q.p.flat())}`);
  };
}

function renderOrder(q){
  const pool=shuffle(q.o);const seq=[];
  const draw=()=>{
    $("#body").innerHTML=`
    <div class="seq" id="seq">${seq.length?seq.map((s,k)=>`<button class="seqitem" data-k="${k}"><em>${k+1}</em>${esc(s)}</button>`).join(""):`<span class="ph">Tap the items below in the right order. Tap a placed item to remove it.</span>`}</div>
    <div class="pool" style="margin-top:12px">${pool.filter(p=>!seq.includes(p)).map(p=>`<button class="pitem" data-v="${esc(p)}">${esc(p)}</button>`).join("")}</div>
    <div class="row" style="margin-top:14px"><button class="btn primary" id="check" ${seq.length<q.o.length?"disabled":""}>Check order</button>${seq.length?`<button class="btn ghost" id="reset">Start again</button>`:""}</div>`;
    document.querySelectorAll(".pitem").forEach(b=>b.onclick=()=>{seq.push(b.dataset.v);draw()});
    document.querySelectorAll(".seqitem").forEach(b=>b.onclick=()=>{seq.splice(+b.dataset.k,1);draw()});
    if($("#reset"))$("#reset").onclick=()=>{seq.length=0;draw()};
    $("#check").onclick=check;
  };
  const check=()=>{
    const items=[...document.querySelectorAll(".seqitem")];
    let right=0;
    seq.forEach((s,k)=>{items[k].disabled=true;if(s===q.o[k]){right++;items[k].classList.add("opt","correct")}else items[k].classList.add("opt","wrong")});
    $("#check").parentElement.remove();
    const ok=right===q.o.length;
    finish(ok,`<strong>${ok?"Perfect order.":`${right} of ${q.o.length} in the right place.`}</strong>${ok?"":`<span>Correct order: ${q.o.map(esc).join(" → ")}</span>`}${expl(q,q.o)}`);
  };
  draw();
}

function renderPick(q){
  const all=shuffle([...q.r,...q.w]);const chosen=new Set();const need=q.r.length;
  $("#body").innerHTML=`<p style="color:var(--muted)">Choose ${need}.</p>
  <div class="pool picks" style="margin-top:10px">${all.map((o,k)=>`<button class="pk" data-k="${k}" aria-pressed="false">${esc(o)}</button>`).join("")}</div>
  <div class="row" style="margin-top:14px"><button class="btn primary" id="check" disabled>Check answers</button><span class="eyebrow" id="cnt">0 of ${need} chosen</span></div>`;
  const btns=[...document.querySelectorAll(".pk")];
  btns.forEach(b=>b.onclick=()=>{
    const k=+b.dataset.k;
    if(chosen.has(k))chosen.delete(k);else if(chosen.size<need)chosen.add(k);
    btns.forEach(x=>{const on=chosen.has(+x.dataset.k);x.classList.toggle("on",on);x.setAttribute("aria-pressed",on)});
    $("#cnt").textContent=`${chosen.size} of ${need} chosen`;$("#check").disabled=chosen.size!==need;
  });
  $("#check").onclick=()=>{
    let right=0;
    btns.forEach(x=>{const v=all[+x.dataset.k],isR=q.r.includes(v),on=chosen.has(+x.dataset.k);x.disabled=true;x.classList.remove("on");
      if(on&&isR){right++;x.classList.add("opt","correct")}else if(on)x.classList.add("opt","wrong");else if(isR)x.classList.add("missedpk")});
    $("#check").parentElement.remove();
    const ok=right===need;
    finish(ok,`<strong>${ok?"All correct.":`${right} of ${need} correct.`}</strong>${ok?"":`<span>The answer: ${q.r.map(esc).join(", ")}</span>`}${expl(q,[...q.r,...[...chosen].map(k=>all[k])])}`);
  };
}

function renderSA(q){
  $("#body").innerHTML=`<p style="color:var(--muted)">You need ${q.need} of the ${q.p.length} key points to pass.</p>
  <textarea class="sa" id="ans" rows="4" placeholder="Type your answer here"></textarea>
  <div class="row" style="margin-top:12px"><button class="btn primary" id="check" disabled>Check my answer</button></div>`;
  const ta=$("#ans");ta.oninput=()=>{$("#check").disabled=ta.value.trim().length<3};ta.focus();
  $("#check").onclick=()=>{
    const txt=" "+ta.value.toLowerCase().replace(/[’']/g,"")+" ";
    const hit=q.p.map(([,kw])=>kw.some(k=>new RegExp("(^|[^a-z])"+k.toLowerCase().replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).test(txt)));
    const n=hit.filter(Boolean).length,ok=n>=q.need;
    ta.disabled=true;$("#check").parentElement.remove();
    finish(ok,`<strong>${ok?`Good answer: ${n} of ${q.p.length} key points.`:`${n} of ${q.p.length} key points. Have another look at the model answer.`}</strong>
      <div class="pts">${q.p.map(([l],i)=>`<span class="${hit[i]?"hit":"miss"}">${hit[i]?"✓":"○"} ${esc(l)}</span>`).join("")}</div>
      <span><b>Model answer:</b> ${esc(q.a)}</span>${expl(q,[q.a])}`);
  };
}

function renderRecall(q){
  $("#body").innerHTML=`<p style="color:var(--muted)">Say or write your answer, then reveal it and mark yourself honestly.</p>
  <div class="row" style="margin-top:12px"><button class="btn primary" id="show">Show answer</button></div>`;
  $("#show").onclick=()=>{
    $("#body").innerHTML=`<div class="reveal">${esc(q.a)}</div>
    <div class="row" style="margin-top:12px"><button class="btn primary" id="got">I got it</button><button class="btn" id="miss">Not yet</button></div>`;
    $("#got").onclick=()=>{$("#body .row").remove();finish(true,`<strong>Marked as known.</strong>${expl(q)}`)};
    $("#miss").onclick=()=>{$("#body .row").remove();finish(false,`<strong>Marked for review.</strong> It will show in your missed list at the end.${expl(q)}`)};
  };
}

/* ---------- Results ---------- */
function answerText(q){
  if(q.t==="mc")return q.o[0];
  if(q.t==="recall")return q.a;
  if(q.t==="order")return q.o.join(" → ");
  if(q.t==="pick")return q.r.join(", ");
  if(q.t==="sa")return q.a;
  return q.p.map(p=>`${p[0]}: ${p[1]}`).join(" · ");
}
function results(){
  const n=S.items.length;const pct=Math.round(S.score/n*100);
  if(S.topicId){const b=best();if(b[S.topicId]==null||pct>b[S.topicId]){b[S.topicId]=pct;store.set("ytr-best",b)}}
  const missed=S.results.filter(r=>!r.ok).map(r=>r.item);
  const byTopic={};S.results.forEach(r=>{const k=r.item.t.name;byTopic[k]=byTopic[k]||[0,0];byTopic[k][1]++;if(r.ok)byTopic[k][0]++});
  const weak=S.topicId?[]:Object.entries(byTopic).filter(([k,v])=>v[0]<v[1]).map(([k])=>k);
  const msg=pct>=90?"Exam ready on this.":pct>=70?"Solid. Go over the missed ones below.":pct>=50?"Getting there. Reread the key facts, then retry.":"Worth another read of the key facts first.";
  app.innerHTML=`
  <div class="stack">
    <span class="eyebrow">${esc(S.title)} · results</span>
    <div class="card">
      <div class="row" style="gap:18px"><span class="big">${pct}%</span><div><strong>${S.score} of ${n} correct</strong><p style="color:var(--muted)">${msg}</p></div></div>
      ${weak.length?`<div><span class="eyebrow">Topics to revisit</span><div class="row" style="margin-top:6px">${weak.map(w=>`<span class="chip gold">${esc(w)}</span>`).join("")}</div></div>`:""}
      <div class="row">${missed.length?`<button class="btn primary" id="retry">Retry the ${missed.length} missed</button>`:""}<button class="btn ${missed.length?"":"primary"}" id="again">Take it again</button><button class="btn ghost" id="home">All topics</button></div>
    </div>
    ${missed.length?`<span class="eyebrow">What you missed</span><div class="missed">${missed.map(m=>`<div><small>${esc(m.t.name)} · ${typeLabel[m.q.t]}</small><strong>${esc(m.q.q)}</strong><br>${esc(answerText(m.q))}</div>`).join("")}</div>`:""}
  </div>`;
  const items=S.items,title=S.title,tid=S.topicId;
  if($("#retry"))$("#retry").onclick=()=>start(title+" · retry",shuffle(missed),tid);
  $("#again").onclick=()=>{
    if(tid)start(title,shuffle(topicById(tid).qs).map(q=>({q,t:topicById(tid)})),tid);
    else if(title.startsWith("Full"))$("#home").click(),$("#full").click();
    else $("#home").click(),$("#quick").click();
  };
  $("#home").onclick=home;
  window.scrollTo(0,0);
}

home();
</script>
<script>
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
</script>
</body>
</html>
