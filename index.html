<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
<title>Yoga Theory Revision</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#1e6b64">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Yoga Revision">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,500;0,700;1,500&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: single study column; topic grid on home, one card per question in quiz */
:root{
  --bg:#eef2ef; --surface:#ffffff; --ink:#1c2826; --muted:#5a6a66; --line:#d5ddd9;
  --accent:#1e6b64; --accent-ink:#ffffff; --soft:#dcebe7; --gold:#c98a1e; --gold-soft:#f6ead2;
  --good:#2b7a47; --good-soft:#dff0e4; --bad:#b0412f; --bad-soft:#f7e1dc;
  --plate:#ffffff; --display:"Spectral",Georgia,"Times New Roman",serif; --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111816; --surface:#19221f; --ink:#e4ece9; --muted:#97a8a3; --line:#2b3835;
  --accent:#5cc0b3; --accent-ink:#0d1a18; --soft:#1f3330; --gold:#e3ad4e; --gold-soft:#33291a;
  --good:#6fc58c; --good-soft:#1b3324; --bad:#ea8473; --bad-soft:#3a201c; --plate:#ffffff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111816; --surface:#19221f; --ink:#e4ece9; --muted:#97a8a3; --line:#2b3835;
  --accent:#5cc0b3; --accent-ink:#0d1a18; --soft:#1f3330; --gold:#e3ad4e; --gold-soft:#33291a;
  --good:#6fc58c; --good-soft:#1b3324; --bad:#ea8473; --bad-soft:#3a201c; --plate:#ffffff; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.2;text-wrap:balance;margin:0}
h1{font-size:2rem}
h2{font-size:1.5rem}
.eyebrow{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.sk{font-family:var(--display);font-style:italic;color:var(--gold)}
p{margin:0}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 14px;min-height:44px;text-align:left}
button:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn{font-weight:600;text-align:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.link{background:none;border:0;padding:6px 0;min-height:0;color:var(--accent);font-weight:600}
header.top{display:flex;flex-direction:column;gap:8px;padding-bottom:20px;border-bottom:1px solid var(--line);margin-bottom:22px}
header.top p{color:var(--muted);max-width:60ch}
.tests{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:26px}
.test{display:flex;flex-direction:column;gap:4px;padding:16px;background:var(--accent);color:var(--accent-ink);border:0}
.test.alt{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.test b{font-family:var(--display);font-size:1.2rem}
.test span{font-size:.88rem;opacity:.85}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.topic{display:flex;flex-direction:column;gap:2px;padding:12px 14px}
.topic:hover{border-color:var(--accent)}
.topic .n{font-weight:600}
.topic .s{font-family:var(--display);font-style:italic;color:var(--muted);font-size:.92rem}
.topic .meta{display:flex;justify-content:space-between;gap:8px;font-size:.8rem;color:var(--muted);margin-top:6px}
.chip{display:inline-block;padding:1px 8px;border-radius:99px;font-size:.78rem;font-weight:600;background:var(--soft);color:var(--accent)}
.chip.gold{background:var(--gold-soft);color:var(--gold)}
.notes{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.notes ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.notes li{max-width:68ch}
.fig{margin:0;background:var(--plate);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;justify-content:center}
.fig img{width:100%;max-width:420px;height:auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:16px}
.progress{height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .25s}
.qmeta{display:flex;justify-content:space-between;gap:10px;font-size:.85rem;color:var(--muted);flex-wrap:wrap}
.q{font-size:1.15rem;font-weight:600;line-height:1.45}
.ctx{color:var(--muted);font-size:.95rem;margin-top:-8px;max-width:60ch}
.opts{display:flex;flex-direction:column;gap:8px}
.opt.correct{background:var(--good-soft);border-color:var(--good);color:var(--ink)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--ink)}
.opt[disabled]{cursor:default}
.fb{border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.fb.good{background:var(--good-soft)}
.fb.bad{background:var(--bad-soft)}
.fb.neutral{background:var(--soft)}
.fb strong{color:var(--ink)}
.defs{display:flex;flex-direction:column;gap:4px;margin-top:6px;padding-top:8px;border-top:1px solid var(--line);font-size:.92rem}
.defs b{font-family:var(--display);font-style:italic;font-weight:600}
.match{display:flex;flex-direction:column;gap:10px}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:10px;align-items:center;padding:8px 10px;border-radius:10px;border:1px solid var(--line)}
.mrow.correct{border-color:var(--good);background:var(--good-soft)}
.mrow.wrong{border-color:var(--bad);background:var(--bad-soft)}
.mrow .l{font-weight:600;min-width:0}
.mrow .fix{grid-column:1/-1;font-size:.88rem;color:var(--bad)}
select{font:inherit;width:100%;min-width:0;min-height:44px;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
@media (max-width:520px){.mrow{grid-template-columns:1fr}}
.seq{display:flex;flex-direction:column;gap:6px;min-height:52px;padding:10px;border:1px dashed var(--line);border-radius:10px}
.seq .ph{color:var(--muted);font-size:.9rem}
.seqitem{display:flex;gap:10px;align-items:center}
.seqitem em{font-style:normal;font-variant-numeric:tabular-nums;color:var(--muted);width:1.5em}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.pk.on{background:var(--soft);border-color:var(--accent);color:var(--ink);font-weight:600}
.pk.missedpk{border:2px dashed var(--good)}
.pk[disabled]{cursor:default}
.reveal{border-left:3px solid var(--gold);padding:10px 14px;background:var(--gold-soft);border-radius:0 10px 10px 0}
.big{font-family:var(--display);font-size:3rem;font-weight:700;line-height:1}
.missed{display:flex;flex-direction:column;gap:10px}
.missed div{padding:12px 14px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-size:.95rem}
.missed small{display:block;color:var(--muted);margin-bottom:2px}
.ep h3{font-size:1.25rem}
.ep audio{width:100%}
.ep details summary{cursor:pointer;color:var(--accent);font-weight:600}
.tx{display:flex;flex-direction:column;gap:6px;margin-top:10px;font-size:.95rem;max-height:420px;overflow:auto}
.foot{margin-top:28px;font-size:.82rem;color:var(--muted)}
textarea.sa{width:100%;box-sizing:border-box;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;resize:vertical}
textarea.sa:focus{outline:2px solid var(--accent);outline-offset:1px}
.pts{display:flex;flex-direction:column;gap:4px;margin:8px 0}
.pts .hit{color:var(--good)}.pts .miss{color:var(--muted)}
.sect{margin-top:22px}.sect:first-of-type{margin-top:0}.sect p.sub{margin:4px 0 0;color:var(--muted);font-size:.9rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

{id:"vayus",name:"5 types of prana",sk:"Prāṇa vāyu",
notes:[
"Prana is the life force. It moves through the body as five <b>vayus</b> (winds), each with its own area and job.",
"<b>Prana</b>: chest and head. Inward. Breathing in, taking in.",
"<b>Apana</b>: pelvis. Downward. Elimination, letting go.",
"<b>Samana</b>: navel. Towards the centre. Digestion.",
"<b>Udana</b>: throat. Upward. Speech, expression.",
"<b>Vyana</b>: the whole body. Outward. Circulation."],
qs:[
C("Prana, the life force, is said to move through the body as five “winds”, each with its own direction and job.",pick("Select the five vayus.",["Prana", "Apana", "Samana", "Udana", "Vyana"],["Pingala", "Tapas", "Mudra"])),
C("Each vayu is centred in a different region of the body.",match("Match each vayu to its area of the body",[["Prana","Chest and head"],["Apana","Pelvis"],["Samana","Navel"],["Udana","Throat"],["Vyana","Whole body"]])),
C("The vayus are the five movements of prana, each flowing in its own direction.",mc("Which vayu moves downward and governs elimination?",["Apana","Prana","Udana","Vyana"])),
C("Each vayu has a job; this one turns what we take in into nourishment.",mc("Which vayu governs digestion?",["Samana","Apana","Udana","Vyana"])),
C("This vayu is also linked with growth, effort and self-expression.",mc("Which vayu is linked to speech and moves upward?",["Udana","Samana","Apana","Prana"])),
C("This vayu connects and coordinates the whole system, like a network.",mc("Which vayu moves through the whole body and governs circulation?",["Vyana","Prana","Samana","Udana"]))
]},

{id:"viveka",name:"Viveka",sk:"Viveka",
notes:[
"<b>Viveka</b> means discernment or discrimination.",
"It is the ability to tell the real from the unreal, and what lasts from what passes.",
"In yoga philosophy it means telling the true Self (Purusha) apart from the changing body and mind (Prakriti).",
"It is the cure for ignorance (avidya)."],
qs:[
C("A quality that yoga philosophy says is the cure for ignorance (avidya).",mc("Viveka means…",["Discernment","Practice","Non-violence","Contentment"])),
C("Viveka is the mind's ability to judge clearly and cut through confusion.",mc("Viveka is the ability to tell apart…",["The real from the unreal","Inhale from exhale","Left from right","Sattva from rajas"])),
C("Samkhya-yoga describes reality as two principles, and says suffering comes from confusing them.",mc("In yoga philosophy, viveka is seeing the difference between…",["Purusha (the Self) and Prakriti (nature)","Ida and Pingala","Yama and Niyama","The koshas"])),
C("A key quality in yoga philosophy, said to be the cure for ignorance (avidya).",mc("Which best describes viveka?",["Telling the lasting Self apart from what changes", "Steady practice over a long time", "Contentment with what you already have", "Withdrawing the senses from the world"]))
]},

{id:"abhyasa",name:"Abhyasa",sk:"Abhyāsa",
notes:[
"<b>Abhyasa</b> means practice: steady, repeated effort.",
"It works best when done for a long time, without breaks, and with care and dedication.",
"It is paired with <b>vairagya</b> (non-attachment). Practice and letting go work together to calm the mind."],
qs:[
C("One of the two methods Patanjali gives for stilling the fluctuations of the mind.",mc("Abhyasa means…",["Practice","Discernment","Purity","Breath control"])),
C("Patanjali names two methods that work together to still the mind, often compared to the two wings of a bird.",mc("Abhyasa is traditionally paired with…",["Vairagya (non-attachment)","Viveka (discernment)","Tapas (discipline)","Pranayama (breathwork)"])),
C("Patanjali says practice needs three conditions to take root.",mc("Practice becomes firmly established when it is done…",["For a long time, without breaks, with dedication","Only when you feel like it","Fast and hard for a short time","Only with a teacher present"])),
C("One of a pair of methods for stilling the mind, like the two wings of a bird.",mc("Abhyasa means… and is paired with…",["Practice; vairagya (non-attachment)", "Non-attachment; viveka (discernment)", "Discipline; santosha (contentment)", "Practice; pranayama (breath control)"]))
]},

{id:"samskara",name:"Samskara",sk:"Saṁskāra",
notes:[
"A <b>samskara</b> is an impression left in the mind by our actions, thoughts and experiences.",
"Repeated, they become habits and patterns, like grooves worn into a path.",
"Yoga practice helps us notice old samskaras and create new, healthier ones."],
qs:[
C("The word comes from “sam” (together) and “kara” (action or making).",mc("A samskara is…",["An impression left in the mind by actions and experiences","A type of breathing","An energy centre","A yoga posture"])),
C("Samskaras build up in the mind over a lifetime of experience.",mc("Repeating the same samskara over and over creates…",["Habits and patterns","Prana","Chakras","Bandhas"])),
C("Samskaras can be helpful or unhelpful, and they are not fixed.",mc("How does yoga practice work with samskaras?",["It helps form new, positive impressions","It deletes them instantly","It has nothing to do with them","It makes them stronger"])),
C("A key idea in yoga psychology, from “sam” (together) and “kara” (making).",mc("Which is the best example of a samskara at work?",["Reaching for your phone whenever you feel bored, without thinking", "Holding a pose for five breaths", "Reading a yoga text for the first time", "Breathing through the left nostril"]))
]},

{id:"dukkha",name:"Dukkha",sk:"Duḥkha",
notes:[
"<b>Dukkha</b> means suffering, pain or dissatisfaction.",
"The image behind the word is a wheel that doesn't fit its axle well, so the ride is bumpy.",
"Its opposite is <b>sukha</b>: ease, happiness.",
"Yoga teaches that much future suffering can be avoided."],
qs:[
C("A key word in both the Yoga Sutras and Buddhism; the Buddha's first noble truth is about it.",mc("Dukkha means…",["Suffering / dissatisfaction","Happiness","Breath","Practice"])),
C("Dukkha has a partner word that describes the opposite state.",mc("The opposite of dukkha is…",["Sukha","Sattva","Samskara","Satya"])),
C("The word is built from “du” (bad) and “kha” (space or hole).",mc("The traditional image behind “dukkha” is…",["A badly fitting wheel","A closed door","A storm","A broken pot"])),
C("A key word in the Yoga Sutras and Buddhism, often met when asking why we practise.",mc("Dukkha and its opposite are…",["Suffering, and sukha (ease)", "Ease, and sukha (suffering)", "Suffering, and sattva (balance)", "Pain, and samskara (impression)"]))
]},

{id:"samyama",name:"Samyama",sk:"Saṁyama",
notes:[
"<b>Samyama</b> is the last three limbs practised together on one object:",
"<b>Dharana</b> (concentration) → <b>Dhyana</b> (meditation) → <b>Samadhi</b> (absorption)."],
qs:[
C("Samyama means “holding together”, and is taught in the third book of the Yoga Sutras.",mc("Samyama is the combination of…",["Dharana, dhyana and samadhi","Yama, niyama and asana","Asana, pranayama and pratyahara","Ida, pingala and sushumna"])),
C("The last three limbs are practised together, each deepening the one before.",order("Put the three parts of samyama in order.",["Dharana (concentration)","Dhyana (meditation)","Samadhi (absorption)"])),
C("Taught in Book 3 of the Yoga Sutras; the name means “holding together”.",mc("Samyama happens when…",["Concentration, meditation and absorption are held on one object", "All eight limbs are practised in one session", "The three bandhas are held together", "Ida and pingala are in balance"]))
]},

{id:"gunas",name:"Gunas",sk:"Guṇa",
notes:[
"The three <b>gunas</b> are qualities found in everything in nature, including our body and mind.",
"<b>Sattva</b>: balance, clarity, harmony, light.",
"<b>Rajas</b>: activity, energy, passion, restlessness.",
"<b>Tamas</b>: inertia, heaviness, dullness; also rest and stability.",
"Yoga aims to increase sattva."],
qs:[
C("In yoga and Ayurveda, everything in nature is a mix of three qualities.",pick("Select the three gunas.",["Sattva", "Rajas", "Tamas"],["Satya", "Santosha", "Samskara"])),
C("Each guna is a different quality, seen in food, moods and even times of day.",match("Match each guna to its quality",[["Sattva","Balance, clarity"],["Rajas","Activity, restlessness"],["Tamas","Inertia, heaviness"]])),
C("Each guna shows up in how the mind feels from moment to moment.",mc("Feeling restless and unable to sit still is mostly…",["Rajas","Sattva","Tamas"])),
C("Our mood shifts between the three gunas through the day.",mc("Feeling sluggish, heavy and unmotivated is mostly…",["Tamas","Sattva","Rajas"])),
C("Practice, diet and lifestyle can all tip the balance of the three gunas.",mc("Which guna does yoga practice aim to increase?",["Sattva","Rajas","Tamas"]))
]},

{id:"bandhas",name:"Bandhas",sk:"Bandha",
notes:[
"<b>Bandha</b> means lock or seal. Bandhas are used to hold and direct energy (prana).",
"<b>Mula bandha</b>: root lock, lifting the pelvic floor.",
"<b>Uddiyana bandha</b>: abdominal lock, drawing the belly in and up.",
"<b>Jalandhara bandha</b>: throat lock, chin drawn towards the chest.",
"<b>Maha bandha</b>: all three together."],
qs:[
C("Used in asana and pranayama, and described in the Hatha Yoga Pradipika.",mc("Bandha means…",["Lock / seal","Breath","Wheel","Channel"])),
C("Each bandha engages a different part of the body.",match("Match each bandha to where it is",[["Mula bandha","Pelvic floor"],["Uddiyana bandha","Abdomen"],["Jalandhara bandha","Throat"]])),
C("The three main bandhas can be held one at a time or all at once.",mc("All three bandhas held together are called…",["Maha bandha","Mula bandha","Samyama","Pranayama"])),
C("“Jala” means net; this bandha is often used during breath retention.",mc("Jalandhara bandha involves…",["Drawing the chin towards the chest","Lifting the pelvic floor","Drawing the belly in and up","Pressing the hands into the floor"])),
C("Bandhas are used to hold and direct prana, especially in pranayama.",pick("Select the three main bandhas.",["Mula bandha", "Uddiyana bandha", "Jalandhara bandha"],["Anahata bandha", "Kapala bandha", "Nadi bandha"]))
]},

{id:"upanishads",name:"Upanishads",sk:"Upaniṣad",
notes:[
"The <b>Upanishads</b> are ancient Indian philosophical texts.",
"The name means “sitting down near”: a student sitting close to a teacher.",
"They are the final part of the Vedas, so they are also called <b>Vedanta</b> (end of the Vedas).",
"Their main teaching: the individual Self (<b>Atman</b>) is one with ultimate reality (<b>Brahman</b>).",
"The five koshas come from one of them, the Taittiriya Upanishad."],
qs:[
C("The name describes how these teachings were originally received.",mc("“Upanishad” means…",["Sitting down near (a teacher)","Eight limbs","Song of God","Lock"])),
C("They are among the oldest spiritual texts of India, around 2,500 years old or more.",mc("The Upanishads are the final part of…",["The Vedas","The Yoga Sutras","The Bhagavad Gita","The Hatha Yoga Pradipika"])),
C("They explore the nature of the self and of the universe.",mc("The main teaching of the Upanishads is that…",["Atman (the Self) is one with Brahman (ultimate reality)","The body must be strong","Asana is the goal of yoga","The gunas are bad"])),
C("Ancient texts from India, studied for thousands of years, and the source of the koshas.",mc("Which statement about the Upanishads is true?",["They are the final part of the Vedas and teach that Atman is Brahman", "They were written by Patanjali and set out the eight limbs", "They are a hatha yoga manual describing the bandhas", "They are a modern commentary on the Bhagavad Gita"]))
]},

{id:"koshas",name:"Koshas",sk:"Kośa",
notes:[
"<b>Kosha</b> means sheath or layer. We have five, from outer to inner:",
"<b>Annamaya</b>: physical (food) body.",
"<b>Pranamaya</b>: energy / breath body.",
"<b>Manomaya</b>: mental and emotional body.",
"<b>Vijnanamaya</b>: wisdom / intellect body.",
"<b>Anandamaya</b>: bliss body."],
qs:[
C("The koshas are often pictured like the layers of an onion around the true Self.",order("Put the five koshas in order, outer to inner.",["Annamaya","Pranamaya","Manomaya","Vijnanamaya","Anandamaya"])),
C("Each sheath is named after what it is “made of” (-maya means “made of”).",match("Match each kosha to its meaning",[["Annamaya","Physical body"],["Pranamaya","Energy / breath"],["Manomaya","Mind and emotions"],["Vijnanamaya","Wisdom / intellect"],["Anandamaya","Bliss"]])),
C("The Taittiriya Upanishad describes five of these around the true Self.",mc("Kosha means…",["Sheath / layer","Wheel","Lock","Channel"])),
C("Different practices reach different layers: asana, breath, meditation and so on.",mc("Breathwork works most directly on which kosha?",["Pranamaya","Annamaya","Anandamaya","Vijnanamaya"])),
C("The koshas go from the most physical on the outside to the most subtle at the centre.",mc("Which is the innermost kosha?",["Anandamaya","Annamaya","Manomaya","Pranamaya"]))
]},

{id:"kleshas",name:"Kleshas",sk:"Kleśa",
notes:[
"<b>Klesha</b> means affliction: the causes of suffering. There are five:",
"<b>Avidya</b>: ignorance (the root of the others).",
"<b>Asmita</b>: ego, I-am-ness.",
"<b>Raga</b>: attachment to pleasure.",
"<b>Dvesha</b>: aversion to pain.",
"<b>Abhinivesha</b>: fear of death, clinging to life."],
qs:[
C("Patanjali lists five of these in Book 2 of the Yoga Sutras.",pick("Select the five kleshas.",["Avidya", "Asmita", "Raga", "Dvesha", "Abhinivesha"],["Ahimsa", "Santosha", "Viveka"])),
C("Each klesha is a different way the mind causes us suffering.",match("Match each klesha to its meaning",[["Avidya","Ignorance"],["Asmita","Ego"],["Raga","Attachment"],["Dvesha","Aversion"],["Abhinivesha","Fear of death"]])),
C("Patanjali lists five of them, and much of yoga practice aims to weaken them.",mc("Kleshas are…",["Causes of suffering","Energy channels","Types of breath","Ethical rules"])),
C("Patanjali says one klesha is the field in which all the others grow.",mc("Which klesha is the root of all the others?",["Avidya","Raga","Dvesha","Asmita"])),
C("Two of the kleshas are opposite pulls: towards what we like and away from what we dislike.",mc("Clinging to things we enjoy is…",["Raga","Dvesha","Asmita","Abhinivesha"]))
]},

{id:"purusha",name:"Purusha",sk:"Puruṣa",
notes:[
"<b>Purusha</b> is pure consciousness: the true Self, the unchanging witness or “seer”.",
"It is the opposite partner of Prakriti (nature, everything that changes).",
"When the mind is still, we experience our true nature as Purusha."],
qs:[
C("In Samkhya philosophy, one of the two basic principles that make up reality.",mc("Purusha is…",["Pure consciousness, the true Self","Matter and nature","The physical body","A type of breath"])),
C("Purusha is one half of the Samkhya pair, alongside Prakriti.",mc("Purusha is often called…",["The seer / witness","The seen","The doer","The breath"])),
C("Purusha is contrasted with Prakriti, the world of nature and matter.",mc("Which statement about Purusha is true?",["It never changes","It is made of the gunas","It is the same as the mind","It is the physical body"])),
C("One of the two principles of Samkhya philosophy, the partner of Prakriti.",mc("Which describes Purusha?",["Unchanging pure consciousness, the witness", "The changing world of nature and matter", "The breath moving through the body", "The quality of balance and clarity"]))
]},

{id:"prakriti",name:"Prakriti",sk:"Prakṛti",
notes:[
"<b>Prakriti</b> is nature or matter: everything that changes and can be seen or known.",
"It includes the body, the senses and even the mind.",
"It is made up of the three <b>gunas</b>.",
"Purusha is the seer; Prakriti is the seen."],
qs:[
C("In Samkhya philosophy, one of the two basic principles that make up reality, the partner of Purusha.",mc("Prakriti is…",["Nature / matter, everything that changes","Pure consciousness","The true Self","Liberation"])),
C("Everything in nature, including body and mind, shares the same basic ingredients.",mc("Prakriti is made up of…",["The three gunas","The five koshas","The eight limbs","The five kleshas"])),
C("In Samkhya, everything that changes belongs to one side of the pair.",mc("Does the mind belong to Purusha or Prakriti?",["Prakriti","Purusha"])),
C("Samkhya sorts everything into one of these two categories.",match("Purusha or Prakriti?",[["The body","Prakriti"],["The witness","Purusha"],["Thoughts","Prakriti"],["Pure awareness","Purusha"]])),
C("The two principles of Samkhya philosophy, which underpins the Yoga Sutras.",mc("Which pair is correct?",["Purusha: the seer, unchanging. Prakriti: the seen, changing", "Purusha: the seen, changing. Prakriti: the seer, unchanging", "Both are made of the three gunas", "Both are forms of prana"]))
]},

{id:"yamas",name:"Yamas",sk:"Yama",
notes:[
"The <b>yamas</b> are the first limb: ethical restraints, how we treat others and the world.",
"<b>Ahimsa</b>: non-violence.",
"<b>Satya</b>: truthfulness.",
"<b>Asteya</b>: non-stealing.",
"<b>Brahmacharya</b>: moderation, wise use of energy.",
"<b>Aparigraha</b>: non-greed, non-possessiveness."],
qs:[
C("The yamas are the first of Patanjali's eight limbs.",pick("Select the five yamas.",["Ahimsa", "Satya", "Asteya", "Brahmacharya", "Aparigraha"],["Saucha", "Tapas", "Santosha"])),
C("The yamas are ethical guidelines for how we treat others and the world.",match("Match each yama to its meaning",[["Ahimsa","Non-violence"],["Satya","Truthfulness"],["Asteya","Non-stealing"],["Brahmacharya","Moderation"],["Aparigraha","Non-greed"]])),
C("Gandhi made this yama central to his life and politics.",mc("Ahimsa means…",["Non-violence","Truthfulness","Contentment","Purity"])),
C("This yama is about our relationship with possessions.",mc("Not taking more than you need is…",["Aparigraha","Satya","Saucha","Tapas"])),
C("The yamas are the first of Patanjali's eight limbs.",mc("The yamas are mainly about…",["How we treat others and the world","Breathing techniques","Postures","Meditation"]))
]},

{id:"niyamas",name:"Niyamas",sk:"Niyama",
notes:[
"The <b>niyamas</b> are the second limb: personal observances, how we treat ourselves.",
"<b>Saucha</b>: cleanliness, purity.",
"<b>Santosha</b>: contentment.",
"<b>Tapas</b>: discipline, inner fire.",
"<b>Svadhyaya</b>: self-study, study of texts.",
"<b>Ishvara pranidhana</b>: surrender to a higher power."],
qs:[
C("The niyamas are the second of the eight limbs.",pick("Select the five niyamas.",["Saucha", "Santosha", "Tapas", "Svadhyaya", "Ishvara pranidhana"],["Ahimsa", "Satya", "Aparigraha"])),
C("The niyamas are personal practices for how we treat ourselves.",match("Match each niyama to its meaning",[["Saucha","Cleanliness"],["Santosha","Contentment"],["Tapas","Discipline"],["Svadhyaya","Self-study"],["Ishvara pranidhana","Surrender to a higher power"]])),
C("One of the five niyamas, the second limb of yoga.",mc("Santosha means…",["Contentment","Cleanliness","Truthfulness","Discipline"])),
C("One of the five niyamas, the personal observances.",mc("Svadhyaya means…",["Self-study","Surrender","Non-stealing","Concentration"])),
C("The first two of the eight limbs are both ethical guidelines.",mc("What is the difference between yamas and niyamas?",["Yamas are about how we treat others; niyamas are about how we treat ourselves","They are the same thing","Yamas are postures; niyamas are breathing","Niyamas come first"]))
]},

{id:"limbs",name:"8 limbs",sk:"Aṣṭāṅga",
notes:[
"Patanjali's eight limbs of yoga (<i>ashtanga</i>), in order:",
"<b>Yama</b> ethical restraints · <b>Niyama</b> personal observances · <b>Asana</b> posture · <b>Pranayama</b> breath control · <b>Pratyahara</b> withdrawal of the senses · <b>Dharana</b> concentration · <b>Dhyana</b> meditation · <b>Samadhi</b> absorption / bliss."],
qs:[
C("Patanjali's eight limbs move from outward behaviour to inner states.",order("Put the eight limbs in order.",["Yama","Niyama","Asana","Pranayama","Pratyahara","Dharana","Dhyana","Samadhi"])),
C("Together the eight limbs form Patanjali's path from the Yoga Sutras.",match("Match each limb to its meaning",[["Yama","Ethical restraints"],["Niyama","Personal observances"],["Asana","Posture"],["Pranayama","Breath control"],["Pratyahara","Withdrawal of the senses"],["Dharana","Concentration"],["Dhyana","Meditation"],["Samadhi","Absorption"]])),
C("Patanjali's system from the Yoga Sutras, and also the name of a modern style of yoga.",mc("Ashtanga means…",["Eight limbs","Eight breaths","Eight postures","Eight chakras"])),
C("This limb sits between the outer limbs and the inner ones.",mc("Which limb is withdrawal of the senses?",["Pratyahara","Pranayama","Dharana","Dhyana"])),
C("The limbs build on each other, from the body towards the mind.",mc("Which limb comes straight after asana?",["Pranayama","Pratyahara","Niyama","Dharana"])),
C("Patanjali's eight-limbed path from the Yoga Sutras.",mc("Which limb comes just before samadhi?",["Dhyana", "Dharana", "Pratyahara", "Pranayama"]))
]},

{id:"nadis",name:"Nadis",sk:"Nāḍī",
notes:[
"<b>Nadis</b> are energy channels that carry prana around the body. Traditionally there are 72,000.",
"The three main nadis:",
"<b>Ida</b>: left side, moon, cooling, calming.",
"<b>Pingala</b>: right side, sun, heating, energising.",
"<b>Sushumna</b>: the central channel, running up the spine."],
qs:[
C("Prana is said to travel around the subtle body through these.",mc("Nadi means…",["Energy channel","Energy centre","Lock","Layer"])),
C("The three main nadis are linked to balancing the breath and energy.",match("Match each nadi to its description",[["Ida","Left, moon, cooling"],["Pingala","Right, sun, heating"],["Sushumna","Central, along the spine"]])),
C("Hatha yoga texts describe a vast network of them.",mc("Traditionally, how many nadis are there?",["72,000","7","108","3"])),
C("Kundalini energy is said to rise through this nadi.",mc("Which nadi runs up the centre of the spine?",["Sushumna","Ida","Pingala"])),
C("Nadi shodhana, alternate nostril breathing, is designed to balance them.",pick("Select the three main nadis.",["Ida", "Pingala", "Sushumna"],["Prana", "Apana", "Kundalini"]))
]},

{id:"chakras",name:"Chakras (7)",sk:"Cakra",img:CHAKRA_IMG,imgAlt:"Seated figure showing the seven chakras from Muladhara at the base of the spine to Sahasrara at the crown",
notes:[
"<b>Chakra</b> means wheel. Chakras are energy centres along the spine. The seven chakras, from the base up:",
"<b>Muladhara</b>: root, base of the spine. Grounding, safety.",
"<b>Svadhisthana</b>: sacral, lower belly. Creativity, emotions.",
"<b>Manipura</b>: solar plexus, navel. Willpower, confidence.",
"<b>Anahata</b>: heart. Love, compassion.",
"<b>Vishuddha</b>: throat. Communication, expression.",
"<b>Ajna</b>: third eye, between the eyebrows. Intuition, insight.",
"<b>Sahasrara</b>: crown, top of the head. The thousand-petal lotus. Connection to pure consciousness, spirituality."],
qs:[
C("The chakras run up the spine from its base to the crown of the head.",order("Put the seven chakras in order from the base up.",["Muladhara","Svadhisthana","Manipura","Anahata","Vishuddha","Ajna","Sahasrara"])),
C("Each chakra sits at a point along the spine or in the head.",match("Match each chakra to its location",[["Muladhara","Base of the spine"],["Svadhisthana","Lower belly"],["Manipura","Solar plexus / navel"],["Anahata","Heart"],["Vishuddha","Throat"],["Ajna","Between the eyebrows"],["Sahasrara","Crown of the head"]])),
C("Each chakra is linked with a different area of life and feeling.",match("Match each chakra to its theme",[["Muladhara","Grounding, safety"],["Svadhisthana","Creativity, emotions"],["Manipura","Willpower, confidence"],["Anahata","Love, compassion"],["Vishuddha","Communication"],["Ajna","Intuition"],["Sahasrara","Spiritual connection"]])),
C("Chakras are energy centres along the spine, often pictured as lotuses.",mc("Chakra means…",["Wheel","Channel","Lock","Sheath"])),
C("Its name means “unstruck”, referring to a sound made without any striking.",mc("Which chakra is at the heart?",["Anahata","Manipura","Vishuddha","Ajna"])),
C("Ida and pingala are said to meet at this chakra.",mc("Which chakra is the “third eye”?",["Ajna","Vishuddha","Anahata","Muladhara"])),
C("The highest chakra, linked with pure consciousness.",mc("Which chakra is known as the thousand-petal lotus?",["Sahasrara (crown)","Ajna (third eye)","Anahata (heart)","Muladhara (root)"])),
C("Its name means “thousand-petalled”; it is the highest of the seven.",mc("Where is Sahasrara?",["Crown of the head","Between the eyebrows","Throat","Base of the spine"])),
C("It sits above the six main chakras.",mc("The seventh chakra is…",["Sahasrara, at the crown, the thousand-petal lotus", "Ajna, at the crown, the thousand-petal lotus", "Sahasrara, between the eyebrows, the two-petal lotus", "Vishuddha, at the throat, the thousand-petal lotus"]))
]},

{id:"sutras",name:"Yoga Sutras",sk:"Yoga Sūtra",
notes:[
"The <b>Yoga Sutras</b> were compiled by <b>Patanjali</b>, about 200 to 400 CE.",
"196 short sayings in four books (padas). <i>Sutra</i> means thread.",
"They set out the <b>eight limbs</b> of yoga. The three sutras to know:",
"<b>1.1</b> <i>Atha yoga-anushasanam</i>: “Now begins the teaching of yoga.”",
"<b>1.2</b> <i>Yoga citta-vritti-nirodhah</i>: “Yoga is the stilling of the fluctuations of the mind.”",
"<b>2.46</b> <i>Sthira sukham asanam</i>: “Posture should be steady and comfortable.”"],
qs:[
C("Two come from Book 1 (Samadhi Pada) and one from Book 2 (Sadhana Pada).",match("Match each sutra number to its Sanskrit",[["1.1","Atha yoga-anushasanam"],["1.2","Yoga citta-vritti-nirodhah"],["2.46","Sthira sukham asanam"]])),
C("Three short lines that every teacher trainee learns.",match("Match each sutra to its translation",[["1.1","Now begins the teaching of yoga"],["1.2","Yoga is the stilling of the fluctuations of the mind"],["2.46","Posture should be steady and comfortable"]])),
C("An ancient sage, not a modern teacher.",mc("Who compiled the Yoga Sutras?",["Patanjali","Krishnamacharya","Pattabhi Jois","Swami Vivekananda"])),
C("The sutras are short, like beads on a string.",mc("The word “sutra” means…",["Thread","Breath","Posture","Teacher"])),
C("The text is split into books called padas.",mc("Roughly how many sutras are there?",["196","8","1,000","27"])),
C("This is the most famous definition of yoga.",mc("Which sutra says “Yoga is the stilling of the fluctuations of the mind”?",["1.2","1.1","2.46"])),
C("The only instruction Patanjali gives about how to practise asana.",mc("“Sthira sukham asanam” means…",["Posture should be steady and comfortable","Now begins the teaching of yoga","Yoga is stilling the mind","Practise every day"])),
C("Sutra 1.2 is Patanjali's definition of yoga.",mc("In sutra 1.2, “citta-vritti” means…",["The fluctuations of the mind","The breath","The postures","The teacher"])),
C("From the sutra on asana: two qualities that balance each other.",mc("In sutra 2.46, “sthira” and “sukha” mean…",["Steady and comfortable","Strong and fast","Still and silent","Hot and cold"])),
C("The opening line of the Yoga Sutras.",order("Build sutra 1.1 (“Now begins the teaching of yoga”) by tapping the words in order.",["Atha", "yoga", "anushasanam"])),
C("Patanjali's definition of yoga.",order("Build sutra 1.2 (“Yoga is the stilling of the fluctuations of the mind”) by tapping the words in order.",["Yoga", "citta", "vritti", "nirodhah"])),
C("Patanjali's instruction on asana.",order("Build sutra 2.46 (“Posture should be steady and comfortable”) by tapping the words in order.",["Sthira", "sukham", "asanam"]))
]},

{id:"vinyasa",name:"Vinyasa",sk:"Vinyāsa",
notes:[
"<b>Vinyasa</b> comes from <i>nyasa</i> (to place) and <i>vi</i> (in a special way): placing with intention, arrangement in a particular order.",
"In practice it means <b>linking breath with movement</b>: each movement is paired with an inhale or an exhale, as in the sun salutations.",
"“A vinyasa” is also the short linking flow between poses, for example chaturanga, upward dog, downward dog.",
"The three internal tools at the heart of Vinyasa: <b>breath</b> (ujjayi), <b>bandha</b> and <b>drishti</b>.",
"Modern Vinyasa flow grew out of Krishnamacharya's teaching and Pattabhi Jois's Ashtanga Vinyasa, adapted by Western teachers into flexible flowing classes."],
qs:[
C("A word used for both a style of class and a short linking flow.",mc("What does “vinyasa” generally mean?",["Placing in a special way, linking breath and movement","Fire or heat","Breath of victory","Union of body and mind"],"Nyasa means to place, vi means in a special way.")),
C("Vinyasa teachers talk about three tools that work on the inside rather than the shape of the pose.",pick("Select the three internal tools at the heart of Vinyasa.",["Breath","Bandha","Drishti"],["Mantra","Mudra","Music"])),
C("In a flow class you'll often hear “take a vinyasa” between sides.",mc("What is usually meant by “take a vinyasa”?",["Flow through chaturanga, upward dog and downward dog","Rest in child's pose","Hold the pose for five breaths","Take a sip of water"])),
C("Each movement in a sun salutation has its own breath.",mc("In Vinyasa, how are breath and movement related?",["Each movement is matched to an inhale or an exhale","Breath is held during each movement","Breathing is done only between poses","Breath and movement are kept separate"])),
C("Krishnamacharya used this idea for building a practice in steps.",mc("What does “vinyasa krama” describe?",["A wise, step-by-step progression in sequencing","A type of breath retention","A drishti point","A hands-on adjustment"])),
C("Vinyasa grew from one teacher in Mysore and was shaped by his students.",mc("Which teacher is most often credited as the source of modern Vinyasa?",["Tirumalai Krishnamacharya","B.K.S. Iyengar","Swami Vivekananda","Indra Devi"])),
C("Write a sentence or two, then check it against the key points.",sa("In your own words, what is Vinyasa?",[["Linking breath and movement",["breath"]],["Movement or flow",["move","flow"]],["Placing with intention / in a special way",["plac","intention","special way","arrange","order"]]],"Vinyasa means placing in a special way. In practice it is linking breath with movement, so each movement is matched to an inhale or an exhale, flowing from pose to pose with intention.",2))
]},

{id:"drishti",name:"Drishti",sk:"Dṛṣṭi",
notes:[
"<b>Drishti</b> means focused gaze: a point where the eyes rest during a pose.",
"Why use it: it steadies and focuses the mind, helps <b>balance</b>, keeps the head and neck aligned, and turns attention inward (supporting <b>pratyahara</b>).",
"It is one of Vinyasa's three internal tools, with breath and bandha.",
"Four common drishti points: <b>Nasagrai</b> (tip of the nose), <b>Bhrumadhya</b> (between the eyebrows), <b>Nabhi</b> (navel) and <b>Hastagrai</b> (hand).",
"Examples: Downward dog, navel. Warrior II, front hand.",
"Offer it softly: the gaze should be relaxed, never strained, and students can adjust it for their neck."],
qs:[
C("One of the three internal tools of Vinyasa.",mc("Drishti means…",["Focused gaze","Breath retention","Energy lock","Hand gesture"])),
C("Teachers cue a gaze point for more than just looks.",pick("Select the three main reasons for using drishti.",["Steadies and focuses the mind","Helps balance","Supports withdrawal of the senses (pratyahara)"],["Stretches the eye muscles","Increases heart rate","Replaces the need for breath"])),
C("Each drishti point has a Sanskrit name.",match("Match each drishti to where you look",[["Nasagrai","Tip of the nose"],["Bhrumadhya","Between the eyebrows"],["Nabhi","Navel"],["Hastagrai","Hand"]])),
C("In Warrior II the arms reach out wide.",mc("What is the traditional drishti in Warrior II?",["Hastagrai (front hand)","Nabhi (navel)","Bhrumadhya (eyebrows)","Nasagrai (nose)"])),
C("In downward dog the head hangs between the arms.",mc("What is the traditional drishti in downward-facing dog?",["Nabhi (navel)","Nasagrai (nose)","Hastagrai (hand)","Bhrumadhya (eyebrows)"])),
C("Drishti works with the limb that comes after pranayama.",mc("Drishti most directly supports which of the eight limbs?",["Pratyahara (withdrawal of the senses)","Yama (ethical restraints)","Samadhi (absorption)","Asana (posture)"])),
C("Think about a student with a sore neck.",mc("How should drishti be cued?",["Softly, as an option, adjusted for comfort","As a fixed rule everyone must follow","With the eyes wide and staring","Only for advanced students"]))
]},

{id:"accessibility",name:"Accessibility",sk:"Sulabhatā",
notes:[
"Accessible yoga means every student can take part, whatever their body, age, ability, experience or circumstances.",
"<b>Always offer options</b>: name a variation alongside the full pose every time, so there is a way in for every body.",
"<b>Use props</b>: blocks, straps, bolsters, blankets, a chair or the wall bring the pose to the student.",
"<b>Invitational language</b>: “you might”, “if it feels available”. Avoid “just”, “simply”, “easy” and comparing bodies.",
"<b>Cue sensation, not shape</b>: what the pose should feel like, not a fixed picture of it.",
"Ask about injuries, conditions and pregnancy at the start of class, and plan alternatives.",
"Think about access beyond the mat too: the space, the language you use, the price and who feels welcome."],
qs:[
C("This principle comes up again and again in the Yogaposa cueing guide.",mc("What is the most important habit for an accessible class?",["Offer an option alongside the full pose, every time","Demonstrate only the full version","Teach the hardest version first","Keep the same pace for everyone"])),
C("Props bring the floor closer or support the body.",pick("Select the four items that are yoga props.",["Block","Strap","Bolster","Chair"],["Weights","Resistance band","Skipping rope"])),
C("Some words make a pose sound easy when it isn't for everyone.",mc("Which cue is the most accessible?",["Reach toward your shins or the floor, wherever your hands land","Just touch your toes","Simply straighten your legs","Everyone get your palms flat on the floor"])),
C("This is about what a pose feels like, not how it looks.",mc("“Cue sensation, not shape” means…",["Describe what the pose should feel like, not a fixed picture of it","Only cue the breath","Show the shape and say nothing","Correct students into the exact shape"])),
C("Planning for this happens before the first pose.",mc("When should you ask about injuries and conditions?",["At the start of class, before practice begins","Only if someone looks uncomfortable","At the end of class","Never, it's private"])),
C("Write a sentence or two, then check it against the key points.",sa("Give three ways to make a class more accessible.",[["Offer options or variations",["option","variation","modif","alternative"]],["Use props",["prop","block","strap","bolster","chair","wall"]],["Invitational, inclusive language",["language","invit","word","cue"]],["Ask about injuries or needs",["injur","condition","ask","pregnan","needs"]]],"Offer options and variations for every pose; use props such as blocks, straps, bolsters, a chair or the wall; use invitational, inclusive language; ask about injuries and needs at the start of class.",2))
]},

{id:"vairagya",name:"Vairagya",sk:"Vairāgya",
notes:[
"<b>Vairagya</b> means non-attachment, or dispassion.",
"It is <b>not</b> indifference, detachment from life or suppressing feelings. It means taking part fully while staying free of dependence on a particular outcome.",
"It is the partner of <b>abhyasa</b> (practice). Patanjali says the mind is stilled by practice and non-attachment together.",
"Practice without non-attachment becomes striving; non-attachment without practice becomes passivity. The Yogaposa notes put it as: practice is the inhale, non-attachment is the exhale.",
"On the mat: doing your best in a pose without needing it to look a certain way or improve."],
qs:[
C("The partner of abhyasa in Patanjali's teaching.",mc("Vairagya means…",["Non-attachment","Practice","Discipline","Discernment"])),
C("A common misunderstanding of non-attachment.",mc("Which statement about vairagya is true?",["It means taking part fully without depending on the outcome","It means not caring about anything","It means suppressing your feelings","It means giving up practice"])),
C("Patanjali names two things that work together to still the mind.",mc("Vairagya is paired with…",["Abhyasa (practice)","Ahimsa (non-violence)","Asana (posture)","Avidya (ignorance)"])),
C("The Yogaposa notes use a breathing image for the pair.",mc("If abhyasa is the inhale, vairagya is…",["The exhale","The pause","The inhale too","The drishti"])),
C("Think about how this looks on the mat.",mc("Which is the best example of vairagya in practice?",["Practising fully without needing the pose to look a certain way","Skipping practice when it gets hard","Pushing into a pose to match your neighbour","Only practising when you feel like it"])),
C("Write a sentence or two, then check it against the key points.",sa("Explain how abhyasa and vairagya work together.",[["Abhyasa is practice / effort",["practice","effort"]],["Vairagya is non-attachment / letting go",["attach","letting go","let go","detach","dispassion"]],["They balance each other",["balance","together","both","partner","wing","without"]]],"Abhyasa is steady practice and effort; vairagya is non-attachment, letting go of the outcome. They work together: effort without letting go becomes striving, letting go without effort becomes passivity. Together they still the mind.",2))
]},

{id:"history",name:"History of yoga",sk:"Itihāsa",
notes:[
"<b>Vedic and pre-classical</b> (about 1500 to 500 BCE): yoga means yoking or discipline. No postures yet; disciplined attention, breath and ritual.",
"<b>The Upanishads</b> (about 800 to 300 BCE): from ritual to inner knowledge. Atman, Brahman, meditation and liberation (moksha).",
"<b>The Bhagavad Gita</b> (about 200 BCE to 200 CE): yoga in everyday life. Paths of Karma (action), Bhakti (devotion), Jnana (knowledge) and Dhyana or Raja (meditation).",
"<b>Classical yoga, the Yoga Sutras</b> (about 200 to 400 CE): Patanjali organises yoga into a system with the eight limbs. Asana means a steady, comfortable seat for meditation.",
"<b>Hatha yoga</b> (about 1000 to 1500 CE): the body enters. Hatha Yoga Pradipika, Gheranda Samhita, Shiva Samhita. Postures, breath control, cleansing, bandhas and mudras; postures still limited and not flowing.",
"<b>Modern postural yoga</b> (1800s to 1900s): hatha blends with Indian wrestling, European gymnastics and drill. Krishnamacharya teaches in Mysore.",
"<b>Emergence of Vinyasa</b> (20th century): Krishnamacharya's breath-linked sequences, Pattabhi Jois's Ashtanga Vinyasa, then Western flowing Vinyasa classes."],
qs:[
C("Yoga went from inner knowledge, to a system, to the body, to flow.",order("Put these stages of yoga history in order, oldest first.",["Upanishads","Yoga Sutras","Hatha yoga","Modern Vinyasa flow"])),
C("The meaning of asana changed a lot over time.",mc("In Patanjali's classical yoga, asana mainly meant…",["A steady, comfortable seat for meditation","A flowing sequence of postures","A breathing technique","A cleansing practice"])),
C("This period first put the body at the centre of practice.",mc("Postures, bandhas, mudras and cleansing practices first appear in…",["Hatha yoga texts such as the Hatha Yoga Pradipika","The Vedas","The Upanishads","The Bhagavad Gita"])),
C("A dialogue between Arjuna and Krishna.",mc("The Bhagavad Gita is known for…",["Bringing yoga into everyday life through paths such as karma and bhakti yoga","Introducing sun salutations","Listing the five kleshas","Describing the 72,000 nadis"])),
C("Different texts from different eras.",match("Match each era to what it is known for",[["Upanishads","Atman, Brahman and inner knowledge"],["Bhagavad Gita","Karma, bhakti and jnana yoga"],["Yoga Sutras","Patanjali's eight limbs"],["Hatha yoga","Postures, bandhas and mudras"]])),
C("Modern postural yoga drew on more than old texts.",mc("Modern postural yoga in the 1800s and 1900s blended hatha yoga with…",["Indian wrestling, European gymnastics and military drill","Ballet and Pilates","Martial arts from Japan","Swimming and athletics"])),
C("Think about the meaning of the word before postures existed.",mc("In the Vedic period, “yoga” meant…",["Yoking, discipline or method","A set of postures","Stretching","Breath control only"])),
C("Write a sentence or two, then check it against the key points.",sa("Briefly describe how yoga developed from classical yoga to modern Vinyasa.",[["Patanjali / Yoga Sutras / eight limbs",["patanjali","sutra","eight limbs","8 limbs"]],["Hatha yoga brought in the body / postures",["hatha"]],["Krishnamacharya",["krishnamacharya"]],["Ashtanga / Pattabhi Jois",["jois","ashtanga"]],["Western flowing classes",["west","flow"]]],"Classical yoga (Patanjali's Yoga Sutras, about 200 to 400 CE) set out the eight limbs, with asana as a meditation seat. Hatha yoga (about 1000 to 1500 CE) brought in postures, breath control, bandhas and mudras. In the 20th century Krishnamacharya developed breath-linked sequences in Mysore, which shaped Pattabhi Jois's Ashtanga Vinyasa, and Western teachers adapted these into flowing Vinyasa classes.",2))
]},

{id:"teachers",name:"Key teachers",sk:"Guru",
notes:[
"<b>Patanjali</b>: compiled the Yoga Sutras (about 200 to 400 CE), setting out the eight limbs.",
"<b>Swami Vivekananda</b>: brought yoga philosophy to the West, speaking at the 1893 Parliament of the World's Religions in Chicago.",
"<b>Tirumalai Krishnamacharya</b> (1888 to 1989): “father of modern yoga”. Taught at the Mysore Palace and developed breath-linked dynamic sequences. His students shaped yoga worldwide.",
"<b>K. Pattabhi Jois</b> (1915 to 2009): Krishnamacharya's student. Created <b>Ashtanga Vinyasa</b>: set series, breath, bandha and drishti, Mysore-style teaching.",
"<b>B.K.S. Iyengar</b> (1918 to 2014): Krishnamacharya's student. <b>Iyengar yoga</b>: precise alignment and props. Wrote <i>Light on Yoga</i> (1966).",
"<b>Indra Devi</b> (1899 to 2002): Krishnamacharya's first Western woman student; took yoga to Hollywood and around the world.",
"<b>T.K.V. Desikachar</b>: Krishnamacharya's son, who adapted practice to the individual."],
qs:[
C("He taught at the Mysore Palace in the 20th century.",mc("Who is often called the father of modern yoga?",["Tirumalai Krishnamacharya","Swami Vivekananda","Patanjali","B.K.S. Iyengar"])),
C("All four studied with the same teacher.",match("Match each teacher to what they're known for",[["Pattabhi Jois","Ashtanga Vinyasa"],["B.K.S. Iyengar","Alignment and props"],["Indra Devi","Taking yoga to Hollywood and the West"],["T.K.V. Desikachar","Adapting practice to the individual"]])),
C("A book published in 1966 that is still widely used.",mc("Who wrote Light on Yoga?",["B.K.S. Iyengar","Pattabhi Jois","Indra Devi","Patanjali"])),
C("This teacher's system uses set series and Mysore-style classes.",mc("Ashtanga Vinyasa was developed by…",["K. Pattabhi Jois","T.K.V. Desikachar","Swami Vivekananda","Indra Devi"])),
C("A famous speech in Chicago in 1893.",mc("Who brought yoga philosophy to the West at the 1893 Parliament of the World's Religions?",["Swami Vivekananda","Krishnamacharya","Patanjali","B.K.S. Iyengar"])),
C("One wrote an ancient text, the other a modern classic.",match("Match each author to their book",[["Patanjali","Yoga Sutras"],["B.K.S. Iyengar","Light on Yoga"]])),
C("Blocks, belts and ropes are now standard in many studios.",mc("Which teacher is best known for introducing props?",["B.K.S. Iyengar","Pattabhi Jois","Swami Vivekananda","Indra Devi"])),
C("Write a sentence or two, then check it against the key points.",sa("Who was Krishnamacharya and why is he important to Vinyasa?",[["Taught in Mysore / father of modern yoga",["mysore","father"]],["Breath-linked sequences / movement",["breath","sequenc","dynamic","flow","vinyasa"]],["Influential students (Jois, Iyengar, Devi, Desikachar)",["jois","iyengar","devi","desikachar","student"]]],"Tirumalai Krishnamacharya (1888 to 1989), the father of modern yoga, taught at the Mysore Palace. He developed dynamic sequences linking breath and movement, the basis of Vinyasa, and his students Pattabhi Jois, B.K.S. Iyengar, Indra Devi and T.K.V. Desikachar spread yoga around the world.",2))
]},

{id:"ujjayi",name:"Ujjayi",sk:"Ujjāyī",
notes:[
"<b>Ujjayi</b>: “victorious breath”, also called ocean breath (<i>ujji</i>, to conquer, + <i>jaya</i>, victory).",
"How: breathe through the nose with the mouth closed, gently narrowing the back of the throat (the glottis) so the breath makes a soft, audible ocean sound. Long and even.",
"Teaching tip: ask students to breathe out with the mouth open as if fogging a mirror, then keep that throat feeling with the mouth closed.",
"Why: it paces movement, steadies and focuses the mind, builds gentle internal heat, and acts as feedback. If the breath becomes strained, ease off.",
"It is the signature breath of Ashtanga and most Vinyasa classes, used throughout active practice.",
"Sources: Hatha Yoga Pradipika and the Krishnamacharya lineage. Cautions: recent throat surgery, a severe asthma flare-up."],
qs:[
C("The most common breath in Vinyasa classes.",mc("Ujjayi means…",["Victorious breath","Skull-shining breath","Cooling breath","Humming bee breath"])),
C("It has a soft, audible sound.",mc("How is ujjayi breath created?",["Breathing through the nose while gently narrowing the back of the throat","Short, sharp exhales from the belly","Breathing in through a curled tongue","Humming on the exhale"])),
C("A popular way to teach it to beginners.",mc("Which cue is often used to teach ujjayi?",["Breathe out as if fogging a mirror, then close the mouth and keep that feeling","Pump the belly quickly","Close the right nostril with your thumb","Hiss the air in across your teeth"])),
C("Teachers rely on it all through a flow class.",pick("Select the three main benefits of ujjayi in a Vinyasa class.",["Paces the movement","Focuses the mind","Builds gentle internal heat"],["Cools the body down","Replaces the warm-up","Makes you breathe faster"])),
C("The breath tells you something about effort.",mc("If a student's ujjayi becomes strained or ragged, they should…",["Ease off or rest until the breath is steady again","Push harder to finish the pose","Hold the breath","Breathe through the mouth faster"])),
C("Write a sentence or two, then check it against the key points.",sa("Describe ujjayi breath and why it is used in Vinyasa.",[["Through the nose",["nose","nostril"]],["Narrowing the back of the throat / audible ocean sound",["throat","glottis","sound","ocean","audible"]],["Paces or links movement",["pace","movement","rhythm","link","tempo"]],["Focus / steadies the mind",["focus","mind","concentrat","steady","calm"]]],"Ujjayi, victorious breath, is breathing through the nose with a gentle narrowing at the back of the throat, giving a soft ocean sound. In Vinyasa it paces and links the movement, focuses and steadies the mind, builds gentle heat, and gives feedback on effort.",2))
]},

{id:"breathing",name:"Other breathing techniques",sk:"Prāṇāyāma",
notes:[
"<b>Nadi shodhana</b> (alternate nostril breathing): balancing and calming; good at the start or end of class.",
"<b>Kapalabhati</b> (skull-shining breath): short, sharp exhales from the lower belly, passive inhales. Energising and cleansing. Avoid in pregnancy, high blood pressure, heart conditions, hernia and after abdominal surgery.",
"<b>Bhastrika</b> (bellows breath): forceful inhale and exhale. Energising and heating. Similar cautions to kapalabhati.",
"<b>Bhramari</b> (humming bee breath): a long hum on the exhale. Calming; lovely before sleep.",
"<b>Sitali</b> (cooling breath): inhale through a curled tongue. <b>Sitkari</b> (hissing breath): inhale across the teeth, for those who can't curl the tongue. Both cooling.",
"<b>Dirgha</b> (three-part breath): fill belly, ribs, then chest; empty in reverse. Foundational and calming.",
"<b>Sama vritti</b> (equal or box breathing): inhale and exhale the same length."],
qs:[

{id:"breathmove",name:"Breath, movement & music",sk:"Prāṇa · Gati",
notes:[
"<b>Inhale</b> with movements that lift, open, lengthen or extend: arms rising, backbends, lifting the chest, lengthening the spine.",
"<b>Exhale</b> with movements that fold, twist, lower or release: forward folds, twists, lowering to the floor.",
"Let the breath lead: the movement starts with the breath and fits inside it. One breath, one movement in the sun salutations.",
"The breath is a guide to effort: if it becomes short or strained, ease off. Holds are often counted in breaths, for example five breaths.",
"Cueing order in the Yogaposa course: <b>breath, instruction, pose name, cue</b>, for example “Inhale, step your right foot forward, Warrior I, root down through your back heel”.",
"<b>Music</b> is optional and should support the class, not take it over: low enough for your voice to be heard, tempo matched to the part of class (calmer at the start and end).",
"Many teachers use instrumental music or silence for savasana and meditation, since lyrics can distract. Think about students who find music overwhelming.",
"Playing recorded music in a public class usually needs a music licence (in the UK, PPL PRS) unless the venue already has one."],
qs:[
C("Some movements naturally fit the in-breath, others the out-breath.",mc("Which movement is usually done on an inhale?",["Raising the arms overhead","Folding forward","Twisting","Lowering to the floor"])),
C("Think about which half of the breath helps you soften.",mc("Forward folds and twists are usually done on…",["An exhale","An inhale","A held breath","Either, it doesn't matter"])),
C("Sort each movement by its breath.",match("Match each movement to its breath",[["Lifting the chest into a backbend","Inhale"],["Folding forward","Exhale"],["Lengthening the spine","Inhale"],["Twisting","Exhale"]])),
C("The Yogaposa course gives a set order for cueing in flow.",order("Put the parts of a Vinyasa cue in the order taught in the course.",["Breath","Instruction","Pose name","Cue"])),
C("The breath tells you a lot about effort.",mc("A student's breath becomes short and strained. What does it tell you?",["They are working too hard and should ease off","They are doing the pose perfectly","They should hold their breath","They need to move faster"])),
C("Music can help or hinder a class.",mc("Which is good practice for music in a yoga class?",["Keep it low enough that your cues are clearly heard","Play it loud to build energy","Use lyrics during savasana","Change the playlist mid-pose"])),
C("Think about the quietest part of the class.",mc("What do many teachers choose for savasana?",["Instrumental music or silence","Fast, upbeat songs","Music with lots of lyrics","The loudest track of the class"])),
C("Playing recorded music in public has a legal side.",mc("In the UK, playing recorded music in a public class usually requires…",["A music licence (PPL PRS), unless the venue already has one","Nothing at all","Permission from each student","A first aid certificate"])),
C("Write a sentence or two, then check it against the key points.",sa("How do you link breath with movement when teaching Vinyasa?",[["Inhale to lift, open or extend",["inhale"]],["Exhale to fold, twist or release",["exhale"]],["Breath leads / one breath one movement",["lead","one breath","each movement","start","initiat","match","pair"]]],"Inhale with movements that lift, open and extend, such as raising the arms or backbends; exhale with movements that fold, twist or release. Let the breath lead and each movement fit one breath, cueing the breath first.",2))
]},

{id:"structure",name:"Class structure",sk:"Krama",
notes:[
"A well-shaped class has a clear arc: arrive, build heat, reach a peak, cool down, rest.",
"<b>Arrival and centring</b>: welcome, ask about injuries and consent for hands-on assists, settle the breath, maybe set an intention (sankalpa).",
"The Yogaposa (MV200) <b>4 Beat</b> structure: <b>Warm up</b> (sun salutations A and B) → <b>Stand up</b> (standing poses) → <b>Sit down</b> (seated poses) → <b>Lie down</b> (closing poses and savasana).",
"A <b>peak pose</b> is the most demanding pose of the class; the sequence prepares the body for it and then counter-poses afterwards.",
"<b>Savasana</b> closes the practice: a few minutes of stillness (many teachers allow 5 to 10) to absorb the practice.",
"End with a short closing, for example a moment of gratitude, OM or Namaste, and be available for questions."],
qs:[
C("Four short beats, from moving to resting.",order("Put the MV200 4 Beat class structure in order.",["Warm up","Stand up","Sit down","Lie down"])),
C("The very first part of class, before anyone moves much.",pick("Select the three things to do at the start of class.",["Ask about injuries","Check consent for hands-on assists","Settle the breath"],["Teach the peak pose","Start savasana","Play the loudest music"])),
C("The warm-up in the MV200 sequence uses a classic flow.",mc("What makes up the Warm up beat in the MV200 sequence?",["Sun salutations A and B","Seated forward folds","Savasana","Backbends"])),
C("Everything else in the sequence builds towards it.",mc("A peak pose is…",["The most demanding pose that the class builds towards","The first pose of the class","Always a standing balance","The final resting pose"])),
C("This is the last pose of a class.",mc("Why is savasana included at the end?",["To rest and absorb the effects of the practice","To build heat","To stretch the hamstrings","To fill time"])),
C("Think about how energy rises and falls.",mc("What is the overall shape of a well-structured class?",["Arrive, build up, peak, cool down, rest","Start with the hardest poses then rest","Stay at the same intensity throughout","Rest first, then the hardest poses at the end"])),
C("Write a sentence or two, then check it against the key points.",sa("Outline the structure of a typical Vinyasa class.",[["Arrival / centring / breath",["arriv","centr","settle","welcome","intention","breath"]],["Warm up / sun salutations",["warm","sun salut","surya"]],["Standing / peak",["stand","peak"]],["Seated / cool down",["seat","sit","cool"]],["Savasana / rest / lie down",["savasana","shavasana","rest","lie down","relax"]]],"Arrival and centring (welcome, injuries and consent, settle the breath), warm up with sun salutations, standing poses building to a peak, seated poses to cool down, then lie down for closing poses and savasana, and a short closing.",2))
]},

{id:"cues",name:"Teaching cues",sk:"Saṅketa",
notes:[
"Three kinds of cue: <b>verbal</b> (what you say), <b>visual</b> (demonstration) and <b>tactile</b> (hands-on, only with consent).",
"Cueing order taught in the course: <b>breath → instruction → pose name → cue</b>. Breath first, refinement last.",
"<b>Action first, then the name</b>: “bend your front knee, reach your arms wide… Warrior II”, so people can follow before they know the pose.",
"<b>Invite, don't command</b>: “you might…”, “when you're ready…”.",
"<b>Cue sensation, not shape</b>, and <b>always offer an option</b>.",
"<b>Drop assumptions</b>: avoid “just”, “simply”, “obviously” and comparing bodies.",
"Keep cues clear, short and positive: say what to do rather than what not to do.",
"The student's experience, not the teacher, is the centre of the room."],
qs:[
C("Teachers communicate in more than one way.",match("Match each type of cue to an example",[["Verbal","Saying “lengthen through your spine”"],["Visual","Demonstrating the pose"],["Tactile","A hands-on assist, with consent"]])),
C("The course gives a set order.",mc("What is the recommended cueing order in a Vinyasa class?",["Breath, instruction, pose name, cue","Pose name, cue, breath, instruction","Cue, breath, pose name, instruction","Instruction, pose name, breath, cue"])),
C("Some words assume everyone finds a pose easy.",mc("Which word is best left out of cues?",["Just","Inhale","Gently","Option"])),
C("Swap a commanding cue for an inviting one.",mc("Which is the better cue?",["Lengthen through your leg, keeping a soft bend if that feels better","Straighten your leg","Lock your knee","Get your leg straight like mine"])),
C("Saying the name first can leave beginners lost.",mc("Why cue the action before the pose name?",["So students can follow even if they don't know the pose","Because Sanskrit names are optional","To save time","So the teacher can demonstrate less"])),
C("Who is the class for?",mc("In a modern Vinyasa class, the centre of the room should be…",["The students' experience","The teacher","The music","The most advanced student"])),
C("Positive cues are easier to follow.",mc("Which cue is phrased positively?",["Stack your front knee over your ankle where you can","Don't let your knee pass your ankle","Never lock your knees","Stop collapsing your chest"])),
C("Write a sentence or two, then check it against the key points.",sa("What makes a good teaching cue?",[["Clear and concise",["clear","short","concise","simple"]],["Invitational / offers options",["invit","option","choice","might"]],["Linked to the breath",["breath"]],["Sensation or action rather than shape / positive",["sensation","feel","action","positive"]]],"Good cues are clear and concise, linked to the breath (breath, instruction, pose name, cue), invitational with options, focused on action and sensation rather than a fixed shape, and phrased positively without assumptions.",2))
]},

{id:"consent",name:"Consent & adjustments",sk:"Anumati",
notes:[
"<b>Never adjust without asking.</b> Consent for hands-on assists should be asked at the start of class, along with any injuries to be flagged.",
"Make it easy to say no: consent cards or chips, or a quiet “may I?” before an assist. A no needs no explanation.",
"Consent can be <b>withdrawn at any time</b>, and a yes at the start doesn't cover everything; check in again.",
"Adjustments can be <b>verbal</b> (a cue), <b>visual</b> (a demonstration) or <b>hands-on</b>. Verbal and visual options include everyone.",
"Hands-on assists should be purposeful, gentle and within your training: never into pain, never forcing, and avoiding sensitive areas.",
"Be trauma-aware: tell students what you're about to do, and approach from where they can see you."],
qs:[
C("This comes before any hands-on assist.",mc("When should you ask for consent for hands-on assists?",["At the start of class, and check in again before assisting","Only after the first assist","Never, it's part of class","Only with new students"])),
C("Saying no should be easy and private.",mc("What is a consent card for?",["Letting students show privately whether they want hands-on assists","Recording attendance","Paying for class","Choosing the music"])),
C("A yes isn't permanent.",mc("A student agreed to assists at the start but now looks uneasy. What should you do?",["Check in again; consent can be withdrawn at any time","Continue, they already agreed","Assist more firmly","Ignore it"])),
C("Not every adjustment uses touch.",pick("Select the three types of adjustment.",["Verbal","Visual (demonstration)","Hands-on"],["Mandatory","Silent correction","Group touch"])),
C("Safe assists follow some clear rules.",mc("Which hands-on assist is appropriate?",["A gentle, purposeful assist within your training that the student agreed to","Pushing a student deeper into a stretch","Assisting a student who said no","Adjusting into pain to improve the pose"])),
C("Being aware of trauma changes how you approach.",mc("Which is a trauma-aware way to assist?",["Tell the student what you're about to do and approach where they can see you","Approach quietly from behind","Assist without speaking","Surprise them with a deeper stretch"])),
C("Write a sentence or two, then check it against the key points.",sa("How should a teacher handle consent for hands-on adjustments?",[["Ask before touching / at the start of class",["ask","start","before","permission"]],["Easy to say no / consent cards",["card","chip","no","decline","opt"]],["Can be withdrawn / check in again",["withdraw","any time","anytime","check in","again","change"]],["Offer verbal or visual alternatives",["verbal","visual","demonstrat","alternative"]]],"Ask for consent at the start of class (with injuries), make it easy to say no with consent cards or a quiet question, check in again before each assist since consent can be withdrawn at any time, and offer verbal or visual adjustments as alternatives.",2))
]},

{id:"inclusion",name:"Inclusion & boundaries",sk:"Maryādā",
notes:[
"<b>Inclusion</b>: make everyone feel welcome, whatever their body, age, ability, gender, culture, background or experience.",
"Use inclusive language, for example “everyone” or “folks” rather than “ladies” or “guys”, and don't assume what bodies can do.",
"Respect yoga's roots: teach Sanskrit and philosophy with care and acknowledge where the practice comes from.",
"<b>Scope of practice</b>: a yoga teacher doesn't diagnose or give medical advice. Suggest students check with a doctor or physiotherapist.",
"<b>Professional relationships</b>: keep relationships with students professional; avoid romantic or sexual relationships with students; be careful with dual relationships and social media.",
"<b>Confidentiality</b>: keep health information students share private.",
"Professional practice also means insurance, first aid, being on time and prepared, and keeping up your own learning.",
"The yama of <b>aparigraha</b> reminds teachers not to grasp at authority or admiration."],
qs:[
C("Think about how a group is addressed.",mc("Which greeting is the most inclusive?",["Welcome, everyone","Hi ladies","Hey guys","Welcome, girls"])),
C("A student asks about pain in their knee.",mc("What should a yoga teacher do?",["Offer modifications and suggest they see a doctor or physiotherapist","Diagnose the injury","Prescribe exercises to fix it","Tell them to push through it"])),
C("Some lines a teacher shouldn't cross.",mc("Which is a professional boundary?",["Not having romantic or sexual relationships with students","Never speaking to students after class","Refusing to answer questions","Only teaching friends"])),
C("Students sometimes share health details.",mc("A student tells you about a health condition. You should…",["Keep it confidential and use it only to keep them safe","Mention it to the class so others understand","Post about it to raise awareness","Tell the student's friends"])),
C("Being a professional teacher involves practical things too.",pick("Select the three parts of professional practice.",["Holding insurance","First aid training","Arriving prepared and on time"],["Diagnosing injuries","Choosing students' diets","Socialising with students after every class"])),
C("This yama has a special lesson for teachers.",mc("Which yama reminds a teacher not to grasp at authority or admiration?",["Aparigraha","Ahimsa","Satya","Saucha"])),
C("Write a sentence or two, then check it against the key points.",sa("What does working within your scope of practice mean for a yoga teacher?",[["Don't diagnose / give medical advice",["diagnos","medical","advice","treat"]],["Refer to health professionals",["doctor","physio","gp","refer","professional","health"]],["Stay within your training",["training","qualif","scope","limit"]]],"Staying within what you are trained for: not diagnosing or giving medical advice, referring students to a doctor or physiotherapist when needed, and only teaching and assisting within your training.",2))
]}
];
