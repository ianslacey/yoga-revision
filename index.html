<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<style>
/* Layout: single study column; topic grid on home, one card per question in quiz */
:root{
  --bg:#eef2ef; --surface:#ffffff; --ink:#1c2826; --muted:#5a6a66; --line:#d5ddd9;
  --accent:#1e6b64; --accent-ink:#ffffff; --soft:#dcebe7; --gold:#c98a1e; --gold-soft:#f6ead2;
  --good:#2b7a47; --good-soft:#dff0e4; --bad:#b0412f; --bad-soft:#f7e1dc;
  --display:"Spectral",Georgia,"Times New Roman",serif; --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111816; --surface:#19221f; --ink:#e4ece9; --muted:#97a8a3; --line:#2b3835;
  --accent:#5cc0b3; --accent-ink:#0d1a18; --soft:#1f3330; --gold:#e3ad4e; --gold-soft:#33291a;
  --good:#6fc58c; --good-soft:#1b3324; --bad:#ea8473; --bad-soft:#3a201c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111816; --surface:#19221f; --ink:#e4ece9; --muted:#97a8a3; --line:#2b3835;
  --accent:#5cc0b3; --accent-ink:#0d1a18; --soft:#1f3330; --gold:#e3ad4e; --gold-soft:#33291a;
  --good:#6fc58c; --good-soft:#1b3324; --bad:#ea8473; --bad-soft:#3a201c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.2;text-wrap:balance;margin:0}
h1{font-size:2rem}
h2{font-size:1.5rem}
.eyebrow{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.sk{font-family:var(--display);font-style:italic;color:var(--gold)}
p{margin:0}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 14px;min-height:44px;text-align:left}
button:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn{font-weight:600;text-align:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.link{background:none;border:0;padding:6px 0;min-height:0;color:var(--accent);font-weight:600}
header.top{display:flex;flex-direction:column;gap:8px;padding-bottom:20px;border-bottom:1px solid var(--line);margin-bottom:22px}
header.top p{color:var(--muted);max-width:60ch}
.tests{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:26px}
.test{display:flex;flex-direction:column;gap:4px;padding:16px;background:var(--accent);color:var(--accent-ink);border:0}
.test.alt{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.test b{font-family:var(--display);font-size:1.2rem}
.test span{font-size:.88rem;opacity:.85}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.topic{display:flex;flex-direction:column;gap:2px;padding:12px 14px}
.topic:hover{border-color:var(--accent)}
.topic .n{font-weight:600}
.topic .s{font-family:var(--display);font-style:italic;color:var(--muted);font-size:.92rem}
.topic .meta{display:flex;justify-content:space-between;gap:8px;font-size:.8rem;color:var(--muted);margin-top:6px}
.chip{display:inline-block;padding:1px 8px;border-radius:99px;font-size:.78rem;font-weight:600;background:var(--soft);color:var(--accent)}
.chip.gold{background:var(--gold-soft);color:var(--gold)}
.notes{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.notes ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.notes li{max-width:68ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:16px}
.progress{height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .25s}
.qmeta{display:flex;justify-content:space-between;gap:10px;font-size:.85rem;color:var(--muted);flex-wrap:wrap}
.q{font-size:1.15rem;font-weight:600;line-height:1.45}
.ctx{color:var(--muted);font-size:.95rem;margin-top:-8px;max-width:60ch}
.opts{display:flex;flex-direction:column;gap:8px}
.opt.correct{background:var(--good-soft);border-color:var(--good);color:var(--ink)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--ink)}
.opt[disabled]{cursor:default}
.fb{border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.fb.good{background:var(--good-soft)}
.fb.bad{background:var(--bad-soft)}
.fb.neutral{background:var(--soft)}
.fb strong{color:var(--ink)}
.match{display:flex;flex-direction:column;gap:10px}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:10px;align-items:center;padding:8px 10px;border-radius:10px;border:1px solid var(--line)}
.mrow.correct{border-color:var(--good);background:var(--good-soft)}
.mrow.wrong{border-color:var(--bad);background:var(--bad-soft)}
.mrow .l{font-weight:600;min-width:0}
.mrow .fix{grid-column:1/-1;font-size:.88rem;color:var(--bad)}
select{font:inherit;width:100%;min-width:0;min-height:44px;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
@media (max-width:520px){.mrow{grid-template-columns:1fr}}
.seq{display:flex;flex-direction:column;gap:6px;min-height:52px;padding:10px;border:1px dashed var(--line);border-radius:10px}
.seq .ph{color:var(--muted);font-size:.9rem}
.seqitem{display:flex;gap:10px;align-items:center}
.seqitem em{font-style:normal;font-variant-numeric:tabular-nums;color:var(--muted);width:1.5em}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.reveal{border-left:3px solid var(--gold);padding:10px 14px;background:var(--gold-soft);border-radius:0 10px 10px 0}
.big{font-family:var(--display);font-size:3rem;font-weight:700;line-height:1}
.missed{display:flex;flex-direction:column;gap:10px}
.missed div{padding:12px 14px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-size:.95rem}
.missed small{display:block;color:var(--muted);margin-bottom:2px}
.foot{margin-top:28px;font-size:.82rem;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="wrap" id="app"></div>

<script>
/* ---------- Question helpers: correct option is always written first ---------- */
const mc=(q,o,x)=>({t:"mc",q,o,x});
const match=(q,p,x)=>({t:"match",q,p,x});
const order=(q,o,x)=>({t:"order",q,o,x});
const recall=(q,a,x)=>({t:"recall",q,a,x});

const C=(c,q)=>(q.c=c,q);
const TOPICS=[
{id:"vayus",name:"5 types of prana",sk:"Prāṇa vāyu",
notes:[
"Prana is the life force. It moves through the body as five <b>vayus</b> (winds), each with its own area and job.",
"<b>Prana</b>: chest and head. Inward. Breathing in, taking in.",
"<b>Apana</b>: pelvis. Downward. Elimination, letting go.",
"<b>Samana</b>: navel. Towards the centre. Digestion.",
"<b>Udana</b>: throat. Upward. Speech, expression.",
"<b>Vyana</b>: the whole body. Outward. Circulation."],
qs:[
C("Prana, the life force, is said to move through the body as five “winds”, each with its own direction and job.",recall("Name the five types of prana (vayus).","Prana, Apana, Samana, Udana, Vyana.")),
C("Each vayu is centred in a different region of the body.",match("Match each vayu to its area of the body",[["Prana","Chest and head"],["Apana","Pelvis"],["Samana","Navel"],["Udana","Throat"],["Vyana","Whole body"]])),
C("The vayus are the five movements of prana, each flowing in its own direction.",mc("Which vayu moves downward and governs elimination?",["Apana","Prana","Udana","Vyana"])),
C("Each vayu has a job; this one turns what we take in into nourishment.",mc("Which vayu governs digestion?",["Samana","Apana","Udana","Vyana"])),
C("This vayu is also linked with growth, effort and self-expression.",mc("Which vayu is linked to speech and moves upward?",["Udana","Samana","Apana","Prana"])),
C("This vayu connects and coordinates the whole system, like a network.",mc("Which vayu moves through the whole body and governs circulation?",["Vyana","Prana","Samana","Udana"]))
]},

{id:"viveka",name:"Viveka",sk:"Viveka",
notes:[
"<b>Viveka</b> means discernment or discrimination.",
"It is the ability to tell the real from the unreal, and what lasts from what passes.",
"In yoga philosophy it means telling the true Self (Purusha) apart from the changing body and mind (Prakriti).",
"It is the cure for ignorance (avidya)."],
qs:[
C("A quality that yoga philosophy says is the cure for ignorance (avidya).",mc("Viveka means…",["Discernment","Practice","Non-violence","Contentment"])),
C("Viveka is the mind's ability to judge clearly and cut through confusion.",mc("Viveka is the ability to tell apart…",["The real from the unreal","Inhale from exhale","Left from right","Sattva from rajas"])),
C("Samkhya-yoga describes reality as two principles, and says suffering comes from confusing them.",mc("In yoga philosophy, viveka is seeing the difference between…",["Purusha (the Self) and Prakriti (nature)","Ida and Pingala","Yama and Niyama","The koshas"])),
C("A key quality in yoga philosophy, said to be the cure for ignorance (avidya).",recall("In one sentence, what is viveka?","Discernment: the ability to tell the real, lasting Self from what is changing and temporary."))
]},

{id:"abhyasa",name:"Abhyasa",sk:"Abhyāsa",
notes:[
"<b>Abhyasa</b> means practice: steady, repeated effort.",
"It works best when done for a long time, without breaks, and with care and dedication.",
"It is paired with <b>vairagya</b> (non-attachment). Practice and letting go work together to calm the mind."],
qs:[
C("One of the two methods Patanjali gives for stilling the fluctuations of the mind.",mc("Abhyasa means…",["Practice","Discernment","Purity","Breath control"])),
C("Patanjali names two methods that work together to still the mind, often compared to the two wings of a bird.",mc("Abhyasa is traditionally paired with…",["Vairagya (non-attachment)","Viveka (discernment)","Tapas (discipline)","Pranayama (breathwork)"])),
C("Patanjali says practice needs three conditions to take root.",mc("Practice becomes firmly established when it is done…",["For a long time, without breaks, with dedication","Only when you feel like it","Fast and hard for a short time","Only with a teacher present"])),
C("One of a pair of methods for stilling the mind, like the two wings of a bird.",recall("What does abhyasa mean, and what is it paired with?","Abhyasa is practice (steady, consistent effort). It is paired with vairagya, non-attachment."))
]},

{id:"samskara",name:"Samskara",sk:"Saṁskāra",
notes:[
"A <b>samskara</b> is an impression left in the mind by our actions, thoughts and experiences.",
"Repeated, they become habits and patterns, like grooves worn into a path.",
"Yoga practice helps us notice old samskaras and create new, healthier ones."],
qs:[
C("The word comes from “sam” (together) and “kara” (action or making).",mc("A samskara is…",["An impression left in the mind by actions and experiences","A type of breathing","An energy centre","A yoga posture"])),
C("Samskaras build up in the mind over a lifetime of experience.",mc("Repeating the same samskara over and over creates…",["Habits and patterns","Prana","Chakras","Bandhas"])),
C("Samskaras can be helpful or unhelpful, and they are not fixed.",mc("How does yoga practice work with samskaras?",["It helps form new, positive impressions","It deletes them instantly","It has nothing to do with them","It makes them stronger"])),
C("A key idea in yoga psychology, from “sam” (together) and “kara” (making).",recall("Explain samskara in your own words.","An impression or imprint left in the mind by what we do and experience. Repeated, they form habits and patterns that shape how we act."))
]},

{id:"dukkha",name:"Dukkha",sk:"Duḥkha",
notes:[
"<b>Dukkha</b> means suffering, pain or dissatisfaction.",
"The image behind the word is a wheel that doesn't fit its axle well, so the ride is bumpy.",
"Its opposite is <b>sukha</b>: ease, happiness.",
"Yoga teaches that much future suffering can be avoided."],
qs:[
C("A key word in both the Yoga Sutras and Buddhism; the Buddha's first noble truth is about it.",mc("Dukkha means…",["Suffering / dissatisfaction","Happiness","Breath","Practice"])),
C("Dukkha has a partner word that describes the opposite state.",mc("The opposite of dukkha is…",["Sukha","Sattva","Samskara","Satya"])),
C("The word is built from “du” (bad) and “kha” (space or hole).",mc("The traditional image behind “dukkha” is…",["A badly fitting wheel","A closed door","A storm","A broken pot"])),
C("A key word in the Yoga Sutras and Buddhism, often met when asking why we practise.",recall("What is dukkha, and what is its opposite?","Dukkha is suffering or dissatisfaction. Its opposite is sukha, ease or happiness."))
]},

{id:"samyama",name:"Samyama",sk:"Saṁyama",
notes:[
"<b>Samyama</b> is the last three limbs practised together on one object:",
"<b>Dharana</b> (concentration) → <b>Dhyana</b> (meditation) → <b>Samadhi</b> (absorption)."],
qs:[
C("Samyama means “holding together”, and is taught in the third book of the Yoga Sutras.",mc("Samyama is the combination of…",["Dharana, dhyana and samadhi","Yama, niyama and asana","Asana, pranayama and pratyahara","Ida, pingala and sushumna"])),
C("The last three limbs are practised together, each deepening the one before.",order("Put the three parts of samyama in order.",["Dharana (concentration)","Dhyana (meditation)","Samadhi (absorption)"])),
C("Taught in Book 3 of the Yoga Sutras; the name means “holding together”.",recall("What is samyama?","Practising dharana (concentration), dhyana (meditation) and samadhi (absorption) together on one object."))
]},

{id:"gunas",name:"Gunas",sk:"Guṇa",
notes:[
"The three <b>gunas</b> are qualities found in everything in nature, including our body and mind.",
"<b>Sattva</b>: balance, clarity, harmony, light.",
"<b>Rajas</b>: activity, energy, passion, restlessness.",
"<b>Tamas</b>: inertia, heaviness, dullness; also rest and stability.",
"Yoga aims to increase sattva."],
qs:[
C("In yoga and Ayurveda, everything in nature is a mix of three qualities.",recall("Name the three gunas.","Sattva, Rajas, Tamas.")),
C("Each guna is a different quality, seen in food, moods and even times of day.",match("Match each guna to its quality",[["Sattva","Balance, clarity"],["Rajas","Activity, restlessness"],["Tamas","Inertia, heaviness"]])),
C("Each guna shows up in how the mind feels from moment to moment.",mc("Feeling restless and unable to sit still is mostly…",["Rajas","Sattva","Tamas"])),
C("Our mood shifts between the three gunas through the day.",mc("Feeling sluggish, heavy and unmotivated is mostly…",["Tamas","Sattva","Rajas"])),
C("Practice, diet and lifestyle can all tip the balance of the three gunas.",mc("Which guna does yoga practice aim to increase?",["Sattva","Rajas","Tamas"]))
]},

{id:"bandhas",name:"Bandhas",sk:"Bandha",
notes:[
"<b>Bandha</b> means lock or seal. Bandhas are used to hold and direct energy (prana).",
"<b>Mula bandha</b>: root lock, lifting the pelvic floor.",
"<b>Uddiyana bandha</b>: abdominal lock, drawing the belly in and up.",
"<b>Jalandhara bandha</b>: throat lock, chin drawn towards the chest.",
"<b>Maha bandha</b>: all three together."],
qs:[
C("Used in asana and pranayama, and described in the Hatha Yoga Pradipika.",mc("Bandha means…",["Lock / seal","Breath","Wheel","Channel"])),
C("Each bandha engages a different part of the body.",match("Match each bandha to where it is",[["Mula bandha","Pelvic floor"],["Uddiyana bandha","Abdomen"],["Jalandhara bandha","Throat"]])),
C("The three main bandhas can be held one at a time or all at once.",mc("All three bandhas held together are called…",["Maha bandha","Mula bandha","Samyama","Pranayama"])),
C("“Jala” means net; this bandha is often used during breath retention.",mc("Jalandhara bandha involves…",["Drawing the chin towards the chest","Lifting the pelvic floor","Drawing the belly in and up","Pressing the hands into the floor"])),
C("Bandhas are used to hold and direct prana, especially in pranayama.",recall("Name the three main bandhas.","Mula bandha (root lock), Uddiyana bandha (abdominal lock), Jalandhara bandha (throat lock)."))
]},

{id:"upanishads",name:"Upanishads",sk:"Upaniṣad",
notes:[
"The <b>Upanishads</b> are ancient Indian philosophical texts.",
"The name means “sitting down near”: a student sitting close to a teacher.",
"They are the final part of the Vedas, so they are also called <b>Vedanta</b> (end of the Vedas).",
"Their main teaching: the individual Self (<b>Atman</b>) is one with ultimate reality (<b>Brahman</b>).",
"The five koshas come from one of them, the Taittiriya Upanishad."],
qs:[
C("The name describes how these teachings were originally received.",mc("“Upanishad” means…",["Sitting down near (a teacher)","Eight limbs","Song of God","Lock"])),
C("They are among the oldest spiritual texts of India, around 2,500 years old or more.",mc("The Upanishads are the final part of…",["The Vedas","The Yoga Sutras","The Bhagavad Gita","The Hatha Yoga Pradipika"])),
C("They explore the nature of the self and of the universe.",mc("The main teaching of the Upanishads is that…",["Atman (the Self) is one with Brahman (ultimate reality)","The body must be strong","Asana is the goal of yoga","The gunas are bad"])),
C("Ancient texts from India, studied for thousands of years, and the source of the koshas.",recall("What are the Upanishads?","Ancient philosophical texts, the final part of the Vedas (Vedanta). Their main teaching is that the Self (Atman) is one with ultimate reality (Brahman)."))
]},

{id:"koshas",name:"Koshas",sk:"Kośa",
notes:[
"<b>Kosha</b> means sheath or layer. We have five, from outer to inner:",
"<b>Annamaya</b>: physical (food) body.",
"<b>Pranamaya</b>: energy / breath body.",
"<b>Manomaya</b>: mental and emotional body.",
"<b>Vijnanamaya</b>: wisdom / intellect body.",
"<b>Anandamaya</b>: bliss body."],
qs:[
C("The koshas are often pictured like the layers of an onion around the true Self.",order("Put the five koshas in order, outer to inner.",["Annamaya","Pranamaya","Manomaya","Vijnanamaya","Anandamaya"])),
C("Each sheath is named after what it is “made of” (-maya means “made of”).",match("Match each kosha to its meaning",[["Annamaya","Physical body"],["Pranamaya","Energy / breath"],["Manomaya","Mind and emotions"],["Vijnanamaya","Wisdom / intellect"],["Anandamaya","Bliss"]])),
C("The Taittiriya Upanishad describes five of these around the true Self.",mc("Kosha means…",["Sheath / layer","Wheel","Lock","Channel"])),
C("Different practices reach different layers: asana, breath, meditation and so on.",mc("Breathwork works most directly on which kosha?",["Pranamaya","Annamaya","Anandamaya","Vijnanamaya"])),
C("The koshas go from the most physical on the outside to the most subtle at the centre.",mc("Which is the innermost kosha?",["Anandamaya","Annamaya","Manomaya","Pranamaya"]))
]},

{id:"kleshas",name:"Kleshas",sk:"Kleśa",
notes:[
"<b>Klesha</b> means affliction: the causes of suffering. There are five:",
"<b>Avidya</b>: ignorance (the root of the others).",
"<b>Asmita</b>: ego, I-am-ness.",
"<b>Raga</b>: attachment to pleasure.",
"<b>Dvesha</b>: aversion to pain.",
"<b>Abhinivesha</b>: fear of death, clinging to life."],
qs:[
C("Patanjali lists five of these in Book 2 of the Yoga Sutras.",recall("Name the five kleshas.","Avidya, Asmita, Raga, Dvesha, Abhinivesha.")),
C("Each klesha is a different way the mind causes us suffering.",match("Match each klesha to its meaning",[["Avidya","Ignorance"],["Asmita","Ego"],["Raga","Attachment"],["Dvesha","Aversion"],["Abhinivesha","Fear of death"]])),
C("Patanjali lists five of them, and much of yoga practice aims to weaken them.",mc("Kleshas are…",["Causes of suffering","Energy channels","Types of breath","Ethical rules"])),
C("Patanjali says one klesha is the field in which all the others grow.",mc("Which klesha is the root of all the others?",["Avidya","Raga","Dvesha","Asmita"])),
C("Two of the kleshas are opposite pulls: towards what we like and away from what we dislike.",mc("Clinging to things we enjoy is…",["Raga","Dvesha","Asmita","Abhinivesha"]))
]},

{id:"purusha",name:"Purusha",sk:"Puruṣa",
notes:[
"<b>Purusha</b> is pure consciousness: the true Self, the unchanging witness or “seer”.",
"It is the opposite partner of Prakriti (nature, everything that changes).",
"When the mind is still, we experience our true nature as Purusha."],
qs:[
C("In Samkhya philosophy, one of the two basic principles that make up reality.",mc("Purusha is…",["Pure consciousness, the true Self","Matter and nature","The physical body","A type of breath"])),
C("Purusha is one half of the Samkhya pair, alongside Prakriti.",mc("Purusha is often called…",["The seer / witness","The seen","The doer","The breath"])),
C("Purusha is contrasted with Prakriti, the world of nature and matter.",mc("Which statement about Purusha is true?",["It never changes","It is made of the gunas","It is the same as the mind","It is the physical body"])),
C("One of the two principles of Samkhya philosophy, the partner of Prakriti.",recall("What is Purusha?","Pure consciousness: the unchanging true Self that witnesses everything."))
]},

{id:"prakriti",name:"Prakriti",sk:"Prakṛti",
notes:[
"<b>Prakriti</b> is nature or matter: everything that changes and can be seen or known.",
"It includes the body, the senses and even the mind.",
"It is made up of the three <b>gunas</b>.",
"Purusha is the seer; Prakriti is the seen."],
qs:[
C("In Samkhya philosophy, one of the two basic principles that make up reality, the partner of Purusha.",mc("Prakriti is…",["Nature / matter, everything that changes","Pure consciousness","The true Self","Liberation"])),
C("Everything in nature, including body and mind, shares the same basic ingredients.",mc("Prakriti is made up of…",["The three gunas","The five koshas","The eight limbs","The five kleshas"])),
C("In Samkhya, everything that changes belongs to one side of the pair.",mc("Does the mind belong to Purusha or Prakriti?",["Prakriti","Purusha"])),

{id:"limbs",name:"8 limbs",sk:"Aṣṭāṅga",

{id:"chakras",name:"Chakras (7)",sk:"Cakra",
notes:[

"<b>Muladhara</b>: root, base of the spine. Grounding, safety.",
"<b>Svadhisthana</b>: sacral, lower belly. Creativity, emotions.",
"<b>Manipura</b>: solar plexus, navel. Willpower, confidence.",
"<b>Anahata</b>: heart. Love, compassion.",
"<b>Vishuddha</b>: throat. Communication, expression.",
"<b>Ajna</b>: third eye, between the eyebrows. Intuition, insight.",
"<b>Sahasrara</b>: crown, top of the head. The thousand-petal lotus. Connection to pure consciousness, spirituality."],
qs:[
C("The chakras run up the spine from its base to the crown of the head.",order("Put the seven chakras in order from the base up.",["Muladhara","Svadhisthana","Manipura","Anahata","Vishuddha","Ajna","Sahasrara"])),
C("Each chakra sits at a point along the spine or in the head.",match("Match each chakra to its location",[["Muladhara","Base of the spine"],["Svadhisthana","Lower belly"],["Manipura","Solar plexus / navel"],["Anahata","Heart"],["Vishuddha","Throat"],["Ajna","Between the eyebrows"],["Sahasrara","Crown of the head"]])),

C("Chakras are energy centres along the spine, often pictured as lotuses.",mc("Chakra means…",["Wheel","Channel","Lock","Sheath"])),
C("Its name means “unstruck”, referring to a sound made without any striking.",mc("Which chakra is at the heart?",["Anahata","Manipura","Vishuddha","Ajna"])),

C("Also the name of a style of yoga.",mc("What does “Vinyasa” mean?",["placement / linked breath-movement", "a fast-paced style of class", "the sequence of the sun salutations", "steady effort repeated over time"])),
C("From the Sanskrit glossary in the Yogaposa app.",mc("Which word means “supported”?",["Salamba", "Danda", "OM (Aum)", "Sthira"])),
C("From the Sanskrit glossary in the Yogaposa app.",mc("Which word means “steady”?",["Sthira", "Salamba", "Mudra", "Tri"])),
C("From the Sanskrit glossary in the Yogaposa app.",mc("Which word means “child”?",["Bala", "Mantra", "OM (Aum)", "Sankalpa"])),
C("From the Sanskrit glossary in the Yogaposa app.",mc("Which word means “community / spiritual fellowship”?",["Sangha", "Namaste", "Mantra", "Guru"])),
C("From the Sanskrit glossary in the Yogaposa app.",mc("Which word means “seat / posture”?",["Asana", "Garuda", "Trikona", "Danda"])),
C("From the Sanskrit glossary in the Yogaposa app.",mc("Which word means “intention / resolve”?",["Sankalpa", "Sukha", "Tri", "Drishti"])),
C("From the Sanskrit glossary in the Yogaposa app.",match("Match each Sanskrit word to its meaning",[["Shava", "corpse"], ["Garuda", "eagle"], ["Chandra", "moon"], ["Uttana", "intense stretch"], ["Tada", "mountain"]])),
C("From the Sanskrit glossary in the Yogaposa app.",match("Match each Sanskrit word to its meaning",[["Mantra", "sacred sound or phrase"], ["Sthira", "steady"], ["Salamba", "supported"], ["Asana", "seat / posture"], ["Adho", "down / downward"]])),
C("From the Sanskrit glossary in the Yogaposa app.",match("Match each Sanskrit word to its meaning",[["Danda", "staff"], ["Drishti", "focused gaze"], ["Shanti", "peace"], ["Tri", "three"], ["Matsya", "fish"]])),
C("From the Sanskrit glossary in the Yogaposa app.",match("Match each Sanskrit word to its meaning",[["Chatur", "four"], ["Mudra", "seal / gesture"], ["Trikona", "triangle"], ["Bhujanga", "serpent / cobra"], ["Vinyasa", "placement / linked breath-movement"]])),
C("From the Sanskrit glossary in the Yogaposa app.",match("Match each Sanskrit word to its meaning",[["Sankalpa", "intention / resolve"], ["Ushtra", "camel"], ["Namaste", "“I bow to you”"], ["Sukha", "ease / comfort"], ["Hala", "plough"]])),
C("From the Sanskrit glossary in the Yogaposa app.",match("Match each Sanskrit word to its meaning",[["OM (Aum)", "primordial sound"], ["Prana", "life-force / vital energy"], ["Guru", "teacher / spiritual preceptor (lit. “heavy, weighty”)"], ["Sangha", "community / spiritual fellowship"], ["Bala", "child"]]))
]}
];

/* ---------- Utilities ---------- */
const $=s=>document.querySelector(s);
const app=$("#app");
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const best=()=>store.get("ytr-best",{});
const topicById=id=>TOPICS.find(t=>t.id===id);
const typeLabel={mc:"Multiple choice",match:"Matching",order:"Put in order",recall:"Recall"};

let S=null;

/* ---------- Home ---------- */
function home(){
  S=null;
  const b=best();
  const total=TOPICS.reduce((n,t)=>n+t.qs.length,0);
  app.innerHTML=`
  <header class="top">
    <span class="eyebrow">Teacher training · theory revision</span>
    <h1>Yoga Theory Revision</h1>
    <p>${total} questions across ${TOPICS.length} topics. Pick a topic to read the key facts and practise, or test yourself across everything.</p>
  </header>
  <div class="tests">
    <button class="test" id="full"><b>Full mock test</b><span>2 questions from every topic · ${TOPICS.length*2} questions</span></button>
    <button class="test alt" id="quick"><b>Quick mix</b><span>15 random questions from anywhere</span></button>
  </div>
  <div class="stack">
    <span class="eyebrow">Topics</span>
    <div class="grid">${TOPICS.map(t=>`
      <button class="topic" data-id="${t.id}">
        <span class="n">${esc(t.name)}</span>
        <span class="s">${t.sk}</span>
        <span class="meta"><span>${t.qs.length} questions</span>${b[t.id]!=null?`<span class="chip ${b[t.id]>=80?"":"gold"}">Best ${b[t.id]}%</span>`:""}</span>
      </button>`).join("")}
    </div>
  </div>
  <p class="foot">Basic level, covering only the listed topics. Translations vary a little between teachers, so check wording against your course manual. Best scores are saved on this device only.</p>`;
  $("#full").onclick=()=>start("Full mock test",shuffle(TOPICS.flatMap(t=>shuffle(t.qs).slice(0,2).map(q=>({q,t})))));
  $("#quick").onclick=()=>start("Quick mix",shuffle(TOPICS.flatMap(t=>t.qs.map(q=>({q,t})))).slice(0,15));
  app.querySelectorAll(".topic").forEach(el=>el.onclick=()=>topicPage(el.dataset.id));
  window.scrollTo(0,0);
}

/* ---------- Topic page ---------- */
function topicPage(id){
  const t=topicById(id);
  app.innerHTML=`
  <div class="stack">
    <button class="link" id="back">← All topics</button>
    <div><span class="sk">${t.sk}</span><h2>${esc(t.name)}</h2></div>
    <div class="notes"><span class="eyebrow">Key facts</span><ul style="margin-top:10px">${t.notes.map(n=>`<li>${n}</li>`).join("")}</ul></div>
    <div class="row"><button class="btn primary" id="go">Practise ${t.qs.length} questions</button><button class="btn ghost" id="back2">Back</button></div>
  </div>`;
  $("#back").onclick=home;$("#back2").onclick=home;
  $("#go").onclick=()=>start(t.name,shuffle(t.qs).map(q=>({q,t})),t.id);
  window.scrollTo(0,0);
}

/* ---------- Quiz engine ---------- */
function start(title,items,topicId){
  S={title,items,i:0,score:0,results:[],topicId};
  render();
}
function render(){
  const {q,t}=S.items[S.i];
  const n=S.items.length;
  app.innerHTML=`
  <div class="stack">
    <div class="row" style="justify-content:space-between"><button class="link" id="quit">← Leave test</button><span class="eyebrow">${esc(S.title)}</span></div>
    <div class="progress"><i style="width:${(S.i/n)*100}%"></i></div>
    <div class="card">
      <div class="qmeta"><span>Question ${S.i+1} of ${n} · ${typeLabel[q.t]}</span><span>${esc(t.name)} · Score ${S.score}</span></div>
      <div class="q">${esc(q.q)}</div>
      ${q.c?`<div class="ctx">${esc(q.c)}</div>`:""}
      <div id="body"></div>
      <div id="fb"></div>
    </div>
  </div>`;
  $("#quit").onclick=()=>S.topicId?topicPage(S.topicId):home();
  ({mc:renderMC,match:renderMatch,order:renderOrder,recall:renderRecall})[q.t](q);
  window.scrollTo(0,0);
}
function finish(ok,html){
  S.results.push({item:S.items[S.i],ok});
  if(ok)S.score++;
  const fb=$("#fb");
  fb.innerHTML=`<div class="fb ${ok===null?"neutral":ok?"good":"bad"}">${html||""}</div>
  <div class="row" style="margin-top:12px"><button class="btn primary" id="next">${S.i+1<S.items.length?"Next question":"See results"}</button></div>`;
  $("#next").onclick=()=>{S.i++;S.i<S.items.length?render():results()};
  $("#next").focus({preventScroll:true});
}
const expl=q=>q.x?`<span>${esc(q.x)}</span>`:"";

function renderMC(q){
  const correct=q.o[0];
  const opts=shuffle(q.o);
  $("#body").innerHTML=`<div class="opts">${opts.map((o,k)=>`<button class="opt" data-k="${k}">${esc(o)}</button>`).join("")}</div>`;
  const btns=[...document.querySelectorAll(".opt")];
  btns.forEach(b=>b.onclick=()=>{
    const pick=opts[+b.dataset.k];const ok=pick===correct;
    btns.forEach(x=>{x.disabled=true;if(opts[+x.dataset.k]===correct)x.classList.add("correct")});
    if(!ok)b.classList.add("wrong");
    finish(ok,`<strong>${ok?"Correct.":"Not quite. The answer is: "+esc(correct)}</strong>${expl(q)}`);
  });
}

function renderMatch(q){
  const rights=shuffle([...new Set(q.p.map(p=>p[1]))]);
  const rows=shuffle(q.p);
  $("#body").innerHTML=`<div class="match">${rows.map((p,k)=>`
    <div class="mrow" data-k="${k}"><span class="l">${esc(p[0])}</span>
    <select id="m-${S.i}-${k}" aria-label="Match for ${esc(p[0])}"><option value="">Choose…</option>${rights.map(r=>`<option value="${esc(r)}">${esc(r)}</option>`).join("")}</select></div>`).join("")}
  </div><div class="row" style="margin-top:14px"><button class="btn primary" id="check">Check answers</button><span id="warn" class="eyebrow" hidden>Fill every row first</span></div>`;
  $("#check").onclick=()=>{
    const sels=[...document.querySelectorAll(".mrow select")];
    if(sels.some(s=>!s.value)){$("#warn").hidden=false;return}
    let right=0;
    rows.forEach((p,k)=>{
      const row=document.querySelector(`.mrow[data-k="${k}"]`);const s=sels[k];s.disabled=true;
      if(s.value===p[1]){right++;row.classList.add("correct")}
      else{row.classList.add("wrong");row.insertAdjacentHTML("beforeend",`<span class="fix">Answer: ${esc(p[1])}</span>`)}
    });
    $("#check").parentElement.remove();
    const ok=right===rows.length;
    finish(ok,`<strong>${ok?"All matched.":`${right} of ${rows.length} matched.`}</strong>${ok?"":"<span>Corrections are shown under each row.</span>"}${expl(q)}`);
  };
}

function renderOrder(q){
  const pool=shuffle(q.o);const seq=[];
  const draw=()=>{
    $("#body").innerHTML=`
    <div class="seq" id="seq">${seq.length?seq.map((s,k)=>`<button class="seqitem" data-k="${k}"><em>${k+1}</em>${esc(s)}</button>`).join(""):`<span class="ph">Tap the items below in the right order. Tap a placed item to remove it.</span>`}</div>
    <div class="pool" style="margin-top:12px">${pool.filter(p=>!seq.includes(p)).map(p=>`<button class="pitem" data-v="${esc(p)}">${esc(p)}</button>`).join("")}</div>
    <div class="row" style="margin-top:14px"><button class="btn primary" id="check" ${seq.length<q.o.length?"disabled":""}>Check order</button>${seq.length?`<button class="btn ghost" id="reset">Start again</button>`:""}</div>`;
    document.querySelectorAll(".pitem").forEach(b=>b.onclick=()=>{seq.push(b.dataset.v);draw()});
    document.querySelectorAll(".seqitem").forEach(b=>b.onclick=()=>{seq.splice(+b.dataset.k,1);draw()});
    if($("#reset"))$("#reset").onclick=()=>{seq.length=0;draw()};
    $("#check").onclick=check;
  };
  const check=()=>{
    const items=[...document.querySelectorAll(".seqitem")];
    let right=0;
    seq.forEach((s,k)=>{items[k].disabled=true;if(s===q.o[k]){right++;items[k].classList.add("opt","correct")}else items[k].classList.add("opt","wrong")});
    $("#check").parentElement.remove();
    const ok=right===q.o.length;
    finish(ok,`<strong>${ok?"Perfect order.":`${right} of ${q.o.length} in the right place.`}</strong>${ok?"":`<span>Correct order: ${q.o.map(esc).join(" → ")}</span>`}${expl(q)}`);
  };
  draw();
}

function renderRecall(q){
  $("#body").innerHTML=`<p style="color:var(--muted)">Say or write your answer, then reveal it and mark yourself honestly.</p>
  <div class="row" style="margin-top:12px"><button class="btn primary" id="show">Show answer</button></div>`;
  $("#show").onclick=()=>{
    $("#body").innerHTML=`<div class="reveal">${esc(q.a)}</div>
    <div class="row" style="margin-top:12px"><button class="btn primary" id="got">I got it</button><button class="btn" id="miss">Not yet</button></div>`;
    $("#got").onclick=()=>{$("#body .row").remove();finish(true,`<strong>Marked as known.</strong>${expl(q)}`)};
    $("#miss").onclick=()=>{$("#body .row").remove();finish(false,`<strong>Marked for review.</strong> It will show in your missed list at the end.${expl(q)}`)};
  };
}

/* ---------- Results ---------- */
function answerText(q){
  if(q.t==="mc")return q.o[0];
  if(q.t==="recall")return q.a;
  if(q.t==="order")return q.o.join(" → ");
  return q.p.map(p=>`${p[0]}: ${p[1]}`).join(" · ");
}
function results(){
  const n=S.items.length;const pct=Math.round(S.score/n*100);
  if(S.topicId){const b=best();if(b[S.topicId]==null||pct>b[S.topicId]){b[S.topicId]=pct;store.set("ytr-best",b)}}
  const missed=S.results.filter(r=>!r.ok).map(r=>r.item);
  const byTopic={};S.results.forEach(r=>{const k=r.item.t.name;byTopic[k]=byTopic[k]||[0,0];byTopic[k][1]++;if(r.ok)byTopic[k][0]++});
  const weak=S.topicId?[]:Object.entries(byTopic).filter(([k,v])=>v[0]<v[1]).map(([k])=>k);
  const msg=pct>=90?"Exam ready on this.":pct>=70?"Solid. Go over the missed ones below.":pct>=50?"Getting there. Reread the key facts, then retry.":"Worth another read of the key facts first.";
  app.innerHTML=`
  <div class="stack">
    <span class="eyebrow">${esc(S.title)} · results</span>
    <div class="card">
      <div class="row" style="gap:18px"><span class="big">${pct}%</span><div><strong>${S.score} of ${n} correct</strong><p style="color:var(--muted)">${msg}</p></div></div>
      ${weak.length?`<div><span class="eyebrow">Topics to revisit</span><div class="row" style="margin-top:6px">${weak.map(w=>`<span class="chip gold">${esc(w)}</span>`).join("")}</div></div>`:""}
      <div class="row">${missed.length?`<button class="btn primary" id="retry">Retry the ${missed.length} missed</button>`:""}<button class="btn ${missed.length?"":"primary"}" id="again">Take it again</button><button class="btn ghost" id="home">All topics</button></div>
    </div>
    ${missed.length?`<span class="eyebrow">What you missed</span><div class="missed">${missed.map(m=>`<div><small>${esc(m.t.name)} · ${typeLabel[m.q.t]}</small><strong>${esc(m.q.q)}</strong><br>${esc(answerText(m.q))}</div>`).join("")}</div>`:""}
  </div>`;
  const items=S.items,title=S.title,tid=S.topicId;
  if($("#retry"))$("#retry").onclick=()=>start(title+" · retry",shuffle(missed),tid);
  $("#again").onclick=()=>{
    if(tid)start(title,shuffle(topicById(tid).qs).map(q=>({q,t:topicById(tid)})),tid);
    else if(title.startsWith("Full"))$("#home").click(),$("#full").click();
    else $("#home").click(),$("#quick").click();
  };
  $("#home").onclick=home;
  window.scrollTo(0,0);
}

home();
</script>
<script>
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
</script>
</body>
</html>
